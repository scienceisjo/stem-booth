<svg xmlns="http://www.w3.org/2000/svg" width="520" height="230" viewBox="0 0 520 230"><rect width="520" height="230" fill="white"/><text x="111" y="28" font-family="Malgun Gothic" font-size="20" fill="#172017" text-anchor="middle">A 묶음</text><text x="409" y="28" font-family="Malgun Gothic" font-size="20" fill="#172017" text-anchor="middle">B 묶음</text><line x1="105" y1="63" x2="105" y2="156" stroke="#568600" stroke-width="5"/><circle cx="105" cy="63" r="8" fill="white" stroke="#568600" stroke-width="3"/><circle cx="105" cy="156" r="8" fill="white" stroke="#568600" stroke-width="3"/><line x1="415" y1="63" x2="415" y2="156" stroke="#568600" stroke-width="5"/><circle cx="415" cy="63" r="8" fill="white" stroke="#568600" stroke-width="3"/><circle cx="415" cy="156" r="8" fill="white" stroke="#568600" stroke-width="3"/><line x1="105" y1="108" x2="215" y2="108" stroke="#172017" stroke-width="3"/><line x1="305" y1="108" x2="415" y2="108" stroke="#172017" stroke-width="3"/><line x1="215" y1="108" x2="292" y2="70" stroke="#172017" stroke-width="3"/><text x="260" y="161" font-family="Malgun Gothic" font-size="21" fill="#568600" text-anchor="middle">누르면 A와 B 연결</text><text x="260" y="207" font-family="Malgun Gothic" font-size="19" fill="#172017" text-anchor="middle">A에서 하나, B에서 하나를 양쪽 구리 길에 연결</text><text x="260" y="229" font-family="Malgun Gothic" font-size="16" fill="#52604D" text-anchor="middle">연결 원리도 · 실제 다리 방향은 제품 자료로 확인</text></svg>