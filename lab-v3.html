<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>HNR 연구소 · 어쩌다 반도체 연구원!</title>
<link rel="icon" href="img/favicon.png">
<style>
:root{--primary:#0066cc;--ink:#1d1d1f;--ink48:#7a7a7a;--hairline:#e0e0e0;--paper:#f5f5f7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0d0d10;color:var(--ink);font-family:"SF Pro Display","SF Pro Text",-apple-system,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none}
#game canvas{position:absolute;inset:0;display:block}
button{font:inherit;cursor:pointer}
/* ── HUD ── */
.hud{position:fixed;z-index:20;pointer-events:none}
.hud>*{pointer-events:auto}
#topL{left:14px;top:12px;display:flex;align-items:center;gap:10px}
#topL .brand{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);border-radius:999px;padding:7px 14px 7px 8px;font-size:13px;font-weight:600}
#topL .brand img{width:22px;height:22px;border-radius:6px}
#topL .who{background:rgba(255,255,255,.92);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--ink)}
#topR{right:14px;top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#rate{background:rgba(255,255,255,.92);border-radius:14px;padding:8px 12px;min-width:210px}
#rate .t{display:flex;justify-content:space-between;font-size:12px;color:var(--ink48)}
#rate .t b{color:var(--ink);font-weight:600}
#rate .bar{height:6px;border-radius:99px;background:#e6e6ea;margin-top:6px;overflow:hidden}
#rate .bar i{display:block;height:100%;width:0;background:var(--primary);border-radius:99px;transition:width .5s}
#stamps{display:flex;gap:5px;margin-top:8px}
#stamps span{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--ink48);border-color:#c8c8cc;background:#fff}
#stamps span.got{color:#fff;background:var(--primary);border-color:var(--primary)}
#botL{left:14px;bottom:14px;display:flex;gap:8px}
.pill{background:rgba(255,255,255,.92);border:0;border-radius:999px;padding:9px 14px;font-size:13px;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.pill.blue{background:var(--primary);color:#fff}
#minimap{right:14px;bottom:14px;width:176px;height:128px;border-radius:12px;background:rgba(255,255,255,.92);position:fixed;z-index:20;overflow:hidden}
#minimap .mz{position:absolute;border-radius:3px;background:#d8d8dc}
#minimap .mz.lit{background:#9cc4f0}
#minimap .mz.hall{background:#ececf0}
#minimap .mp{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--ink);border:2px solid #fff;transform:translate(-50%,-50%);z-index:2}
#minimap .mt{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--primary);transform:translate(-50%,-50%)}
#hint{left:50%;bottom:16px;transform:translateX(-50%);background:rgba(29,29,31,.82);color:#fff;font-size:12px;padding:8px 14px;border-radius:999px;white-space:nowrap;transition:opacity .6s}
#talk{left:50%;bottom:64px;transform:translateX(-50%);display:none}
#talk button{background:var(--primary);color:#fff;border:0;border-radius:999px;padding:13px 22px;font-size:16px;font-weight:600;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
/* ── 대화창 ── */
#dlg{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
#dlg.show{display:block}
body.dlg #minimap,body.dlg #botL,body.dlg #talk,body.dlg #hint{display:none!important}
#dlg .box{max-width:820px;margin:0 auto;background:#fff;border-radius:22px;padding:16px 18px 14px;border:1px solid var(--hairline)}
#dlg .row{display:flex;gap:14px;align-items:flex-start}
#dlg .bit{width:64px;height:64px;flex:none}
#dlg .bit canvas{width:64px;height:64px;display:block}
#dlg .lbl{font-size:12px;color:var(--ink48);letter-spacing:.2px}
#dlg .lbl b{color:var(--primary);font-weight:600}
#dlg .txt{font-size:clamp(16px,2.2vw,20px);line-height:1.5;min-height:3em;letter-spacing:-.2px;margin-top:2px}
#dlg .memo{background:#fff8c4;border:1px solid #efe08a;border-radius:8px;padding:12px 14px;font-family:"Nanum Pen Script","Gaegu",cursive,"Malgun Gothic";font-size:clamp(18px,2.6vw,24px);line-height:1.35;transform:rotate(-1deg);display:inline-block;margin-top:4px}
#dlg .memo.board{background:#2f4a3a;color:#f4f4e8;border-color:#5b3a1e;transform:none;font-family:inherit;font-size:clamp(15px,2vw,19px)}
#dlg .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px}
#dlg .btns button,#dlg .btns a{border:1px solid var(--hairline);background:#fff;color:var(--ink);border-radius:999px;padding:11px 18px;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
#dlg .btns .blue{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}
#dlg .btns .ghost{color:var(--ink48)}
#dlg .dots{display:flex;gap:4px;margin-top:6px}
#dlg .dots i{width:6px;height:6px;border-radius:50%;background:#d0d0d5}
#dlg .dots i.on{background:var(--primary)}
/* ── 입장 ── */
#enter{position:fixed;inset:0;z-index:40;background:#0d0d10;display:flex;align-items:center;justify-content:center;padding:20px}
#enter .card{width:min(520px,100%);background:#fff;border-radius:24px;padding:28px 26px 20px}
#enter h1{font-size:clamp(22px,3.4vw,30px);font-weight:600;letter-spacing:-.4px;line-height:1.2}
#enter p{color:var(--ink48);font-size:14px;margin-top:8px;line-height:1.5}
#enter label{display:block;font-size:12px;color:var(--ink48);margin-top:18px}
#enter input{width:100%;border:1px solid var(--hairline);border-radius:12px;padding:13px 14px;font-size:18px;margin-top:6px;outline:none}
#enter input:focus{border-color:var(--primary)}
#avs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
#avs button{width:52px;height:52px;border-radius:14px;border:1.5px solid var(--hairline);background:#fff;padding:8px}
#avs button i{display:block;width:100%;height:100%;border-radius:8px;border:2px solid rgba(0,0,0,.25)}
#avs button.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
#enter .go{width:100%;margin-top:18px;background:var(--primary);color:#fff;border:0;border-radius:999px;padding:15px;font-size:17px;font-weight:600}
#enter .go:disabled{opacity:.4}
#app-credit{font-size:11px;color:var(--ink48);text-align:center;margin-top:16px}
#enter .ld{color:#fff;text-align:center;font-size:14px}
/* ── 완료 ── */
#fin{position:fixed;inset:0;z-index:35;background:rgba(13,13,16,.86);display:none;align-items:center;justify-content:center;padding:20px}
#fin.show{display:flex}
#fin .card{width:min(560px,100%);background:#fff;border-radius:24px;padding:30px 26px 22px;text-align:center}
#fin h2{font-size:clamp(22px,3.4vw,30px);font-weight:600;letter-spacing:-.4px}
#fin p{color:#333;font-size:15px;line-height:1.55;margin-top:10px}
#fin .btns{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
#fin a,#fin button{border:1px solid var(--hairline);background:#fff;color:var(--ink);border-radius:999px;padding:12px 20px;font-size:15px;text-decoration:none}
#fin .blue{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}
@media (max-width:640px){ #minimap{width:120px;height:88px} #rate{min-width:150px} #topL .brand span{display:none} }
</style>
</head>
<body>
<div id="game"></div>

<div class="hud" id="topL">
  <a class="brand" href="dashboard.html"><img src="img/badge.png" alt=""><span>HNR Tech Inc. 연구소</span></a>
  <div class="who" id="who"></div>
</div>
<div class="hud" id="topR">
  <div id="rate"><div class="t"><span>연구소 복구율</span><b id="rateN">0%</b></div><div class="bar"><i id="rateI"></i></div>
    <div id="stamps"></div></div>
</div>
<div class="hud" id="botL">
  <a class="pill" href="dashboard.html">📋 대시보드</a>
  <button class="pill" id="viewBtn" type="button">📷 3인칭</button>
  <button class="pill" id="resetBtn" type="button">다음 팀</button>
</div>
<div id="minimap"></div>
<div class="hud" id="hint">🚶 바닥을 탭하면 걸어가요 · 드래그하면 둘러봐요 · 📷 버튼(V키)으로 시점 바꾸기</div>
<div class="hud" id="talk"><button type="button" id="talkBtn">💬 비트에게 말 걸기</button></div>

<div id="dlg"><div class="box">
  <div class="row"><div class="bit"><canvas id="bitFace" width="128" height="128"></canvas></div>
    <div style="flex:1;min-width:0"><div class="lbl" id="dlgLbl"></div><div class="txt" id="dlgTxt"></div><div class="dots" id="dlgDots"></div></div></div>
  <div class="btns" id="dlgBtns"></div>
</div></div>

<div id="fin"><div class="card">
  <h2>연구소 복구율 100%</h2>
  <p id="finP"></p>
  <div class="btns"><a class="blue" href="dashboard.html">임명장 받으러 가기 →</a><button type="button" id="finClose">연구소 더 둘러보기</button></div>
</div></div>

<div id="enter"><div class="card" id="enterCard">
  <h1>HNR Tech Inc.<br>첫 출근을 축하해요</h1>
  <p>어젯밤 정전으로 연구소의 기억이 전부 지워졌어요. 당신이 구역 여섯 곳을 하나씩 깨워 주세요. 이 태블릿을 들고 연구소를 걸어 다니며 미션을 받아요.</p>
  <label>연구원 이름</label><input id="nameIn" maxlength="12" placeholder="이름 또는 별명" autocomplete="off">
  <label>바지 색 (연구원 가운은 흰색)</label><div id="avs"></div>
  <button class="go" id="goBtn" type="button" disabled>출근하기</button>
  <div id="app-credit">© 2026 조승재(과학이조선생) · 해누리중학교 · All rights reserved · 최종 업데이트 2026-09-08</div>
</div></div>

<script src="lib/three.min.js"></script>
<script>
/* ═══════════ 세션 (booth.js 와 같은 키) ═══════════ */
const KEY = 'hnr.session.v1';
const $ = s => document.querySelector(s);
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ return null; } }
function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }
let S = load();

/* ═══════════ 이야기 ═══════════ */
const NAME = () => (S && S.name) || '신입';
const ROOMS = {
  1:{ title:'정문 게이트', mission:'손잡고 불 켜라', stamp:'연결', link:'m1.html?from=lab',
    intro:['정문은 열쇠가 아니라 회로로 열려요. 동료들과 손을 잡아 보세요.','에너지스틱 양 끝을 잡은 사람이 서로 이어지면 불이 켜져요.','한 사람만 손을 놓으면? 해 보면 알아요.'],
    clear:['문이 열렸어요! 우리 몸을 통해 아주 작은 전류의 길이 이어진 거예요. 한 명이 놓으면 길이 끊겨서 꺼지죠.','아 맞다, 제 이름이 뭐였죠…? 비, 비트! 맞아요 비트.','스탬프 「연결」 획득! 사원증이 발급됐어요. 정문이 열립니다.'] },
  2:{ title:'부품 창고', mission:'캔을 움직여라', stamp:'끌림', link:'m2.html?from=lab',
    intro:['부품 창고예요. 정전 때 부품 통(캔)이 선반에서 굴러 떨어졌어요.',{sign:'⚠ 클린룸 · 손대지 마시오 · 맨손 접촉 금지'},'여긴 클린룸이라 손으로 만지면 안 돼요. 빨대만 쓸 수 있어요.','그냥 빨대는 소용없어요. 문지르기 전과 후, 뭐가 다를까요?'],
    clear:['골인! 손도 안 댔는데 캔이 따라왔죠? 캔은 원래 중성이에요. 대전된 빨대가 다가오자 캔 속 전하가 자리를 바꿔 끌린 거예요.','창고 비밀번호가… 뭐더라. 괜찮아요, 이제 안 잠겨요.','스탬프 「끌림」 획득! 창고가 복구됐어요.'] },
  3:{ title:'조명실', mission:'불빛을 깨워라', stamp:'빛', link:'m3.html?from=lab',
    intro:['조명실이에요. 정전으로 불이 다 꺼졌고, 전선까지 끊어졌어요.','그런데 소장님이 남긴 메모가 있어요.',{memo:'전선 없어도 켜진다.\n가까이.  — 소장'},'형광등을 플라즈마볼 쪽으로 천천히. 어디부터 깨어날까요?'],
    clear:['불빛이 깨어났어요! 플라즈마볼 주변의 빠르게 변하는 전기장이 형광등 속 기체를 자극한 거예요. 멀어지면 자극이 약해져 꺼지죠.','조명실이 밝아지니까… 어라, 저 어두운 게 무서웠던 것 같기도 하고. 기억이 안 나요.','스탬프 「빛」 획득! 조명실이 복구됐어요.'] },
  4:{ title:'자석 연구실', mission:'내 몸을 돌려라', stamp:'회전', link:'m4.html?from=lab',
    intro:['자석 연구실이에요. 소장님이 자석의 비밀을 연구하던 방이죠.','칠판에 이렇게 써 있어요.',{board:'자석의 성질 ↔ 회전이라는 성질\n※ 비유입니다. 전자가 진짜 팽이처럼 도는 건 아님.'},'회전의자에 앉아 돌고 있는 바퀴를 기울여 보세요. 아무도 안 미는데 뭐가 움직이나요?'],
    clear:['돌았죠? 아무도 밀지 않았는데요! 돌고 있는 바퀴의 회전량을 기울이면, 줄어든 만큼 내 몸이 대신 돌아요. 전체 회전량은 그대로랍니다.','물리학자들은 자석의 성질도 전자의 회전 같은 성질로 설명해요. 오늘은 그 이야기를 몸으로 느껴 본 거예요. 비유라는 것, 꼭 기억해요.','빙글빙글… 저도 뭔가 돌았던 기억이… 아니다, 그건 로딩 아이콘이었어요.','스탬프 「회전」 획득! 자석 연구실이 복구됐어요.'] },
  5:{ title:'운송 터널', mission:'건전지야 달려!', stamp:'달림', link:'m5.html?from=lab',
    intro:['운송 터널이에요. 부품을 나르던 코일 열차가 정전 뒤로 멈춰 있어요.','자석을 붙인 건전지를 코일 입구에 살짝 넣어 보세요. 출발하면 성공!','그런데 자석 방향을 바꾸면? 예상 먼저 하고 확인해요.'],
    clear:['출발했어요! 전기와 자석이 만나면 힘이 생겨요. 자석과 닿은 코일 구간에만 전류가 흐르고, 그 구간이 전자석이 되어 자석을 밀어요.','열차가 달리니까 뭔가 실어 나를 게 있었던 것 같은데… 아! 기억실로 가는 열차였어요. 다음이 마지막이에요.','스탬프 「달림」 획득! 터널이 개통됐어요.'] },
  6:{ title:'중앙 기억실', mission:'기억을 만들어라', stamp:'기억', link:'m6.html?from=lab',
    twist:[{memo:'신입에게.\n태블릿 속 비트 말이야, 걔가 자꾸 뭘 까먹지?\n비트가 바로 연구소의 기억이었어. 전하 하나로 된 1비트.\n정전 때 새어 나간 거야. 네가 다시 써 줘야 해.  — 소장'},'…제가요? 제가 기억이었어요?','그래서 자꾸 잊어버렸구나. 전하는 가만히 두면 새어 나가니까.','{name} 연구원, 저를 다시 써 주세요. 1비트면 돼요.'],
    intro:['중앙 기억실이에요. 지금까지 전기로 움직이고, 불을 켜고, 돌리고, 달리게 했죠?','이번엔 전기로 기억을 만들어요. 축전기에 전하를 가두면 1, 비어 있으면 0.','회로를 만들고, 1을 쓰고, 기다리고, 읽어 보세요. 제가 돌아올 거예요.'],
    clear:['…기억났어요! 저 비트예요. HNR 연구소의 1비트!','전하가 있으면 1, 없으면 0. 전하를 가두면 정보가 됩니다.','그런데 방금 봤죠? 읽으면 사라지고, 가만히 두면 새어 나가요. 그래서 컴퓨터 메모리(디램)는 수십억 개의 축전기를 1초에 수십 번씩 다시 써 줘요. 정전이 되면 그걸 못 해서 지워지는 거예요.','마지막 스탬프 「기억」 획득! 연구소가 다시 켜집니다.'] }
};

function roomWalls(r, door){
  const pad = 24, out=[];
  const side = (ax, fixed, a1, a2, gapC, gapW) => {
    const pts = gapC==null ? [[a1,a2]] : [[a1,gapC-gapW/2],[gapC+gapW/2,a2]];
    pts.forEach(([p,q])=>{ if(q-p>4) out.push(ax==='x' ? wallSeg(p,fixed,q,fixed) : wallSeg(fixed,p,fixed,q)); });
  };
  side('x', r.z1-pad, r.x1-pad, r.x2+pad, door.axis==='z'&&door.z<r.z1?door.x:null, door.w);
  side('x', r.z2+pad, r.x1-pad, r.x2+pad, door.axis==='z'&&door.z>r.z2?door.x:null, door.w);
  side('z', r.x1-pad, r.z1-pad, r.z2+pad, door.axis==='x'&&door.x<r.x1?door.z:null, door.w);
  side('z', r.x2+pad, r.z1-pad, r.z2+pad, door.axis==='x'&&door.x>r.x2?door.z:null, door.w);
  return out;
}

/* ═══════════ 이동·카메라 ═══════════ */
function tryMove(nx,nz){
  if(allowed(nx,nz)){ player.x=nx; player.z=nz; return true; }
  if(allowed(nx,player.z)){ player.x=nx; return true; }
  if(allowed(player.x,nz)){ player.z=nz; return true; }
  return false;
}
function stepPlayer(dt){
  let ix=0, iz=0;
  if(keys.ArrowLeft||keys.a) ix-=1; if(keys.ArrowRight||keys.d) ix+=1;
  if(keys.ArrowUp||keys.w) iz-=1; if(keys.ArrowDown||keys.s) iz+=1;
  if(ix||iz){
    walkQueue = [];
    const fx=-Math.sin(camYaw), fz=-Math.cos(camYaw), rx=-fz, rz=fx;
    let dx=fx*(-iz)+rx*ix, dz=fz*(-iz)+rz*ix; const m=Math.hypot(dx,dz); dx/=m; dz/=m;
    walking = tryMove(player.x+dx*SPEED*dt, player.z+dz*SPEED*dt); faceTarget=Math.atan2(dx,dz);
  } else if(walkQueue.length){
    const t = walkQueue[0], tx=t.x-player.x, tz=t.z-player.z, d=Math.hypot(tx,tz);
    if(d<12){ walkQueue.shift(); if(!walkQueue.length) walking=false; }
    else { const st=Math.min(d,SPEED*dt); if(!tryMove(player.x+tx/d*st, player.z+tz/d*st)){ walkQueue=[]; walking=false; } else { walking=true; faceTarget=Math.atan2(tx,tz); } }
  } else walking=false;
}
let nearTerm = null;
function talkLabel(){ const n=nearTerm; if(n) $('#talkBtn').textContent = cleared(n)?'💬 비트 ('+ROOMS[n].title+' 복구됨)':'💬 미션 받기 · '+ROOMS[n].mission; }
function animate(t){
  requestAnimationFrame(animate);
  const dt = Math.min(.05,(t-lastT)/1000); lastT=t;
  if(!uiOpen()) stepPlayer(dt);
  const L = playerChar.userData.limbs, sw = walking ? Math.sin(t/110)*.8 : 0;
  L.legL.rotation.x = sw; L.legR.rotation.x = -sw; L.armL.rotation.x = -sw; L.armR.rotation.x = sw;
  const hop = walking ? Math.abs(Math.sin(t/110))*3 : 0;
  faceAngle = lerpAngle(faceAngle, faceTarget, .25);
  playerChar.rotation.y = faceAngle; playerChar.position.set(player.x, hop, player.z);
  if(VIEW==='fps'){
    const eyeY = 76 + hop;
    camera.position.set(player.x, eyeY, player.z);
    const fx=-Math.sin(camYaw), fz=-Math.cos(camYaw);
    camera.lookAt(player.x+fx*100, eyeY+Math.tan(camPitch)*100, player.z+fz*100);
    if(!walking) faceTarget = camYaw + Math.PI;                       // 서 있을 땐 보는 쪽으로 몸 돌림
  } else if(VIEW==='top'){
    camera.position.lerp(new THREE.Vector3(player.x+Math.sin(camYaw)*topH*.25, topH, player.z+Math.cos(camYaw)*topH*.25), .16);
    camera.lookAt(player.x, 0, player.z);
  } else {
    camera.position.lerp(new THREE.Vector3(player.x+Math.sin(camYaw)*camD, camH, player.z+Math.cos(camYaw)*camD), .16);
    camera.lookAt(player.x, 40, player.z);
  }
  for(let n=1;n<=6;n++){ const b=termSprite[n]; b.position.y = 4+Math.sin(t/500+n)*4; const led=b.userData.led;
    if(b.userData.state==='on'){ led.material.emissive.setHex(BRICK.blue); } else { const k=(Math.sin(t/300+n)+1)/2; led.material.emissive.setHex(k>.5?0x4ac7e3:0x000000); } }
  // 근접 단말기
  let best=null, bd=150;
  for(let n=1;n<=6;n++){ if(!termSprite[n].visible) continue; const d=Math.hypot(player.x-TERM[n].x, player.z-TERM[n].z); if(d<bd){ bd=d; best=n; } }
  if(best!==nearTerm){ nearTerm=best; $('#talk').style.display = best?'block':'none'; talkLabel(); }
  updateMinimap();
  renderer.render(scene,camera);
}
function uiOpen(){ return $('#dlg').classList.contains('show') || $('#fin').classList.contains('show') || $('#enter').style.display!=='none'; }

/* 탭=이동 · 드래그=회전 · 핀치/휠=줌 */
function handleTap(cx,cy){
  if(uiOpen()) return;
  const r = renderer.domElement.getBoundingClientRect();
  pointerV.x=((cx-r.left)/r.width)*2-1; pointerV.y=-((cy-r.top)/r.height)*2+1;
  raycaster.setFromCamera(pointerV,camera);
  const hs = raycaster.intersectObjects(Object.values(termSprite).filter(s=>s.visible), true);
  if(hs.length){ const n=hs[0].object.userData.n; walkQueue = routeTo(TERM[n].x+40, TERM[n].z+40); walkQueue.openN = n; return; }
  const gh = raycaster.intersectObject(floorMesh, false)[0];
  if(gh){ const x=Math.max(20,Math.min(W-20,gh.point.x)), z=Math.max(20,Math.min(H-20,gh.point.z)); walkQueue = allowed(x,z) ? routeTo(x,z) : [{x,z}]; }
}
function initPointer(){
  const el = renderer.domElement; el.style.touchAction='none';
  const ptrs = new Map(); let pinchD=0, drag=null;
  el.addEventListener('pointerdown', ev=>{ if(uiOpen()) return; ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY}); try{el.setPointerCapture(ev.pointerId);}catch(e){}
    if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinchD=Math.hypot(a.x-b.x,a.y-b.y); drag=null; } else if(ptrs.size===1) drag={x:ev.clientX,y:ev.clientY,moved:false,id:ev.pointerId}; });
  el.addEventListener('pointermove', ev=>{ const p=ptrs.get(ev.pointerId); if(p){p.x=ev.clientX;p.y=ev.clientY;}
    if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); if(pinchD){ if(VIEW==='top') topH=Math.max(700,Math.min(2600,topH-(d-pinchD)*3)); else if(VIEW==='tps') camD=Math.max(320,Math.min(1300,camD-(d-pinchD)*1.4)); } pinchD=d; return; }
    if(!drag||ev.pointerId!==drag.id) return; const mx=ev.clientX-drag.x, my=ev.clientY-drag.y;
    if(!drag.moved && Math.hypot(mx,my)>9) drag.moved=true;
    if(drag.moved){ camYaw-=mx*.0055; if(VIEW==='fps') camPitch=Math.max(-1.1,Math.min(1.1,camPitch-my*.004)); else if(VIEW==='tps') camH=Math.max(260,Math.min(900,camH+my*1.5)); drag.x=ev.clientX; drag.y=ev.clientY; hideHint(); } });
  el.addEventListener('pointerup', ev=>{ ptrs.delete(ev.pointerId); if(ptrs.size<2) pinchD=0; if(!drag||ev.pointerId!==drag.id) return; const was=drag.moved, cx=ev.clientX, cy=ev.clientY; drag=null; if(!was){ handleTap(cx,cy); hideHint(); } });
  el.addEventListener('pointercancel', ev=>{ ptrs.delete(ev.pointerId); drag=null; pinchD=0; });
  el.addEventListener('wheel', ev=>{ ev.preventDefault(); if(VIEW==='top') topH=Math.max(700,Math.min(2600,topH+ev.deltaY*1.2)); else if(VIEW==='tps') camD=Math.max(320,Math.min(1300,camD+ev.deltaY*.6)); }, {passive:false});
  addEventListener('keydown', e=>{ const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input') return;
    if(e.key==='Escape'){ return; }
    if(uiOpen()){ if(e.key==='Enter'||e.key===' '){ const b=$('#dlgBtns .blue')||$('#dlgBtns button'); if(b) b.click(); e.preventDefault(); } return; }
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
    if(e.key===' '||e.key==='Enter'||e.key==='e'||e.key==='E'){ if(nearTerm) openTerminal(nearTerm); return; }
    if(e.key==='v'||e.key==='V'){ cycleView(); return; }
    const k=e.key.toLowerCase(); if(keys.hasOwnProperty(e.key)||['a','d','w','s'].includes(k)||e.key.startsWith('Arrow')) keys[e.key.startsWith('Arrow')?e.key:k]=true; });
  addEventListener('keyup', e=>{ const k=e.key.startsWith('Arrow')?e.key:e.key.toLowerCase(); keys[k]=false; });
  addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); buildMinimap(); });
}

function buildMinimap(){
  const mm=$('#minimap'), sx=mm.clientWidth/W, sy=mm.clientHeight/H; let html='';
  const z = (r,cls)=>`<div class="mz ${cls||''}" style="left:${r.x1*sx}px;top:${r.z1*sy}px;width:${(r.x2-r.x1)*sx}px;height:${(r.z2-r.z1)*sy}px"></div>`;
  html += z(RECT.hall, 'hall'); html += z(RECT.out, 'hall');

  for(let n=1;n<=6;n++) html += `<div class="mt" style="left:${TERM[n].x*sx}px;top:${TERM[n].z*sy}px"></div>`;

}

function showLines(lines, label, endBtns, led){
  return new Promise(res=>{
    dlgResolve = res; let i=0; const dlg=$('#dlg'), txt=$('#dlgTxt'), btns=$('#dlgBtns'), dots=$('#dlgDots');
    $('#dlgLbl').innerHTML = label; bitFace(led||'blink');

      if(typeof L==='object'){ const cls = L.board?'memo board':'memo'; txt.innerHTML = `<div class="${cls}">${(L.memo||L.board||L.sign).replace(/\n/g,'<br>')}</div>`; }
      else typewrite(txt, fill(L));
      dots.innerHTML = lines.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('');
      const last = i===lines.length-1;
      btns.innerHTML = '';
      if(!last){ const b=document.createElement('button'); b.className='blue'; b.textContent='다음'; b.onclick=()=>{ i++; render(); }; btns.appendChild(b); }
      else (endBtns||[{t:'확인',cls:'blue',v:'ok'}]).forEach(e=>{ const b=document.createElement(e.href?'a':'button'); b.className=e.cls||''; b.textContent=e.t; if(e.href){ b.href=e.href; } b.onclick=()=>{ if(!e.href){ dlg.classList.remove('show'); document.body.classList.remove('dlg'); res(e.v); } }; btns.appendChild(b); });
    }

  });
}
let twTimer=null;
function typewrite(el, text){ clearTimeout(twTimer); el.textContent=''; let k=0; (function tick(){ el.textContent = text.slice(0,k); if(k<text.length){ k+=2; twTimer=setTimeout(tick,18); } })(); el.onclick=()=>{ clearTimeout(twTimer); el.textContent=text; }; }

async function openTerminal(n){
  const R = ROOMS[n];
  if(cleared(n)){ await showLines(DONE_LINE, `<b>${R.title}</b> · 복구 완료`, [{t:'가상실험 다시 열기 ↗',href:R.link},{t:'닫기',cls:'blue',v:'ok'}], 'on'); return; }
  if(n===6 && !S.seen.twist){ S.seen.twist=true; save(S); await showLines(R.twist, '<b>소장의 쪽지</b> · 중앙 기억실 앞', [{t:'…알겠어요',cls:'blue',v:'ok'}], 'off'); }
  const v = await showLines(R.intro, `<b>미션 ${n}</b> · ${R.mission}`, [
    {t:'가상실험 먼저 보기 ↗', href:R.link}, {t:'나중에', cls:'ghost', v:'later'}, {t:'실물 체험 끝! 스탬프 받기', cls:'blue', v:'done'} ]);
  if(v!=='done') return;
  S.cleared.push(n); S.cleared.sort(); save(S); applyState();
  await showLines(R.clear, `<b>미션 ${n} 완료</b> · 스탬프 「${R.stamp}」`, [{t: n<6?'다음 구역으로':'연구소 재가동!', cls:'blue', v:'ok'}], n===6?'on':'blink');
  if(n===6){ $('#finP').innerHTML = fill(FIN); $('#fin').classList.add('show'); }

}

function initEnter(){
  const g=$('#avs'); g.innerHTML = AVS.map(([c,l])=>`<button type="button" data-a="${c}" class="${c===pickedAv?'on':''}" title="${l}"><i style="background:${c}"></i></button>`).join('');
  g.querySelectorAll('button').forEach(b=>b.onclick=()=>{ pickedAv=b.dataset.a; g.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); });
  const inp=$('#nameIn'), go=$('#goBtn');
  inp.addEventListener('input', ()=>go.disabled = inp.value.trim().length===0);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter'&&!go.disabled) go.click(); });
  go.onclick = ()=>{ S = { name:inp.value.trim().slice(0,12), start:new Date().toISOString(), guest:false, cleared:[], seen:{}, avatar:pickedAv }; save(S); begin(true); };
}
function begin(first){
  $('#enter').style.display='none';
  if(!S.avatar || S.avatar[0]!=='#'){ S.avatar = AVS[0][0]; save(S); }
  buildScene(); initPointer(); buildMinimap();
  if(cleared(1)){ player.x=(RECT.hall.x1+RECT.hall.x2)/2; player.z=1500; }
  camera.position.set(player.x, camH, player.z+camD); setView(VIEW); requestAnimationFrame(animate);
  if(!S.seen.welcome){ S.seen.welcome=true; save(S); setTimeout(()=>showLines(WELCOME, '<b>비트</b> · 연구소 안내 도우미', [{t:'정문으로 가 볼게요',cls:'blue',v:'ok'}], 'off').then(()=>{ walkQueue=[{x:TERM[1].x+40,z:TERM[1].z+40}]; }), 500); }
}
initEnter();
if(S && S.name){ $('#enterCard').innerHTML = `<h1>${S.name} 연구원,<br>다시 오셨군요</h1><p>스탬프 ${S.cleared.length}개 · 이어서 진행해요.</p><button class="go" id="contBtn" type="button">연구소로 들어가기</button><button class="go" id="newBtn" type="button" style="background:#fff;color:var(--ink);border:1px solid var(--hairline);margin-top:8px">다른 사람으로 새로 시작</button><div id="app-credit">© 2026 조승재(과학이조선생) · 해누리중학교 · All rights reserved · 최종 업데이트 2026-09-08</div>`;
  $('#contBtn').onclick=()=>begin(false); $('#newBtn').onclick=()=>{ localStorage.removeItem(KEY); location.reload(); }; }
</script>
</body>
</html>
