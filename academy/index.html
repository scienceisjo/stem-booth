<script id="course-data" type="application/json">{"stations": [{"id": "energy", "title": "에너지스틱", "zone": "정문 보안 게이트", "question": "한 사람만 손을 놓으면 불과 소리는 어떻게 될까요?", "principle": "스틱 안 전지가 에너지를 공급해요. 양 끝 금속 부분과 사람들의 손이 한 바퀴 이어지면 몸이 전기의 길 일부가 되고, 스틱이 아주 작은 전류가 흐르는 연결을 감지해 빛과 소리를 내요. 한 명이 손을 놓으면 경로가 끊어져요. 우리 몸이 전기를 만들어 낸 것은 아니에요.", "steps": ["양 끝의 두 사람이 금속 접촉부를 하나씩 잡고, 옆 사람과 손을 이어 고리를 만들도록 안내해요.", "한 사람이 손을 놓았을 때와 다시 잡았을 때의 빛·소리를 비교하게 해요.", "어디에서 길이 끊겼는지 물어본 뒤 내부 전지와 닫힌 경로를 설명해요.", "손을 놓고 스틱을 내려놓아요. 반응이 없으면 접촉부와 연결부터 확인하고 전지는 진행자가 점검해요."], "safety": ["사람을 잇는 실험은 제공된 에너지스틱으로만 해요. 콘센트나 다른 전원에 연결하지 않아요.", "잘 작동하지 않아도 손에 물이나 침을 묻히지 않아요.", "손이나 스틱을 세게 당기지 않고, 원하지 않는 방문객에게 손잡기를 강요하지 않아요."], "myth": "사람들이 전기를 만들어서 켜지는 것이 아니에요. 에너지원은 내부 전지이고 몸은 감지 경로의 일부예요. 스틱이 조용해졌다고 전지가 즉시 소모됐다고 판단하지 않아요.", "script": "손을 이으니 불과 소리가 나죠? 안의 전지가 에너지를 주고, 스틱은 우리 몸을 포함해 길이 이어졌는지 알아차려요. 한 사람이 손을 놓으면 그 길이 끊겨요. 이번에는 누가 손을 놓아 볼까요? 어느 부분에서 연결이 끊겼는지 함께 찾아보세요.", "faq": [{"q": "전기는 우리 몸에서 만들어지나요?", "a": "스틱 안 전지가 공급해요. 몸은 연결된 경로의 일부가 돼요."}, {"q": "손을 놓으니 왜 조용해졌나요?", "a": "고리가 끊겨 스틱이 이어진 경로를 감지하지 못하기 때문이에요. 접촉을 다시 이었을 때도 비교해 보세요."}, {"q": "손에 물을 묻히면 더 잘될까요?", "a": "이 부스에서는 물을 묻히지 않아요. 금속 접촉부와 손 연결을 먼저 살피고, 계속 반응이 없으면 진행자가 장치를 점검해요."}], "welcome": "정문 연결을 함께 확인해 볼까요? 손을 이었을 때와 놓았을 때를 비교해 봐요.", "explainAfter": "한 사람이 손을 놓자 빛과 소리가 어떻게 달라졌나요? 어디에서 연결이 끊겼나요?", "audience": {"young": "손을 이으니 불과 소리가 났죠? 스틱은 안의 전지로 작동하고, 우리 몸을 포함한 길이 이어졌는지 알아차려요. 손을 놓으면 길이 끊겨요.", "older": "스틱 안 전지가 에너지를 공급해요. 몸과 금속 부분이 한 바퀴 이어지면 아주 작은 전류가 흐르는 연결을 스틱이 감지해요. 한 명이 놓으면 길이 끊겨 빛과 소리가 달라져요.", "teen": "전지는 에너지원이고 몸은 회로의 경로 일부예요. 스틱은 몸을 포함한 닫힌 경로에 작은 감지 전류가 흐르는지 알아차려 빛과 소리를 내요. 손을 놓으면 경로가 끊겨요. 사람이 전기를 만든 것은 아니에요."}}, {"id": "static", "title": "정전기 캔", "zone": "클린룸", "question": "빨대가 캔에 닿지 않아도 캔을 움직일 수 있을까요?", "principle": "마른 천으로 문지른 빨대에는 전하가 모일 수 있어요. 빨대를 가까이 대면 금속 캔 안에서 움직일 수 있는 전자의 분포가 바뀌어요. 빨대와 가까운 쪽의 끌어당기는 효과가 더 커져 캔이 움직일 수 있죠. 캔 전체가 처음부터 반대 전하를 띠어야 하는 것은 아니에요.", "steps": ["빈 캔을 평평한 책상 가운데 눕히고 잘 굴러가는지 확인해요.", "문지르기 전의 빨대를 캔에 닿지 않게 가까이 대고 반응을 봐요.", "빨대를 마른 천으로 문지른 뒤 닿지 않게 가까이 대고 천천히 옮겨요.", "문지르기 전후와 비접촉 상태를 비교해요. 캔은 출발 위치로 돌려놓아요."], "safety": ["캔은 책상 가운데에서 굴리고 떨어지기 전에 체험을 멈춰요.", "빨대로 얼굴을 가리키지 않아요. 찌그러지거나 날카로운 캔은 교체해요.", "반응을 만들려고 캔을 밀거나 입김을 불지 않아요. 마른 재료와 평평한 면부터 점검해요."], "myth": "빨대로 밀어서 움직인 결과와 전기력에 의한 결과를 구분해야 해요. 캔 속 양성자가 자유롭게 이동한 것이 아니며, 캔 전체가 처음부터 빨대와 반대 전하였다고 단정하지 않아요.", "script": "빨대가 닿았는지 먼저 봐 주세요. 닿지 않았는데도 캔이 따라오죠? 문지른 빨대의 전하 때문에 캔 속 전자의 자리가 조금 달라져요. 가까운 쪽에서 끌어당기는 효과가 더 커져 캔이 움직이는 거예요. 문지르기 전과 후도 비교해 볼까요?", "faq": [{"q": "캔을 문지르지 않았는데 왜 따라와요?", "a": "빨대의 전하가 캔 속 전자의 분포를 바꿔요. 가까운 쪽에서 끌어당기는 효과가 더 커질 수 있어요."}, {"q": "빨대를 캔에 붙여도 되나요?", "a": "지금은 닿지 않게 해야 전기력으로 움직였는지 확인하기 좋아요. 닿으면 빨대로 밀었을 수도 있어요."}, {"q": "왜 오늘은 잘 안 움직여요?", "a": "캔이 가볍게 굴러가는지, 빨대와 천이 마른지 확인해요. 다시 문지르고 거리를 조절하되 밀거나 바람을 불지는 않아요."}], "welcome": "클린룸의 캔을 손대지 않고 움직여 볼까요? 책상 가운데에서 빨대가 닿지 않게 해 봐요.", "explainAfter": "빨대가 캔에 닿았나요? 문지르기 전과 후에 캔의 움직임은 어떻게 달랐나요?", "audience": {"young": "닿지 않았는데 캔이 따라왔죠? 문지른 빨대가 전기적인 힘으로 캔을 끌어당겼어요. 빨대로 밀어서 움직인 건 아니에요.", "older": "문지른 빨대에는 전하가 모일 수 있어요. 가까이 대면 캔 속 전하의 자리가 달라지고, 가까운 쪽을 끌어당기는 효과가 더 커져요. 그래서 닿지 않아도 캔이 따라와요.", "teen": "대전된 빨대를 가까이 대면 금속 캔의 전자 분포가 달라져요. 가까운 쪽의 인력이 더 크게 작용해 중성이던 캔도 끌려올 수 있어요. 캔 전체가 처음부터 반대 전하였다는 뜻은 아니에요. 접촉이나 입김 없이 움직였는지 확인하는 것이 중요해요."}}, {"id": "plasma", "title": "플라즈마볼과 형광등", "zone": "암실", "question": "형광등의 긴 옆면을 구 가까이 대고 잡는 손을 옮기면 어디가 빛날까요?", "principle": "플라즈마볼 주변의 빠르게 변하는 전기장이 형광등에 에너지를 전해요. 관 속 기체의 방전과 형광 물질을 통해 빛이 나요. 손과 몸도 유리를 사이에 두고 관 속 전하에 영향을 주고 주변 환경과 전기적으로 연결되는 조건을 바꿔요. 이 장치에서는 먼 끝을 잡으면 긴 구간이, 가운데를 잡으면 주로 구와 손 사이가 빛나는 모습을 볼 수 있어요. 손이 빛을 가린 것이 아니라 방전이 유지되는 조건이 바뀐 것으로 설명할 수 있어요. 실제 밝기는 장치·위치·주변에 따라 달라져요.", "steps": ["플라즈마볼은 받침대에 세워요. 진행자가 형광등을 받치고 방문객은 구에서 먼 쪽 유리 부분을 잡게 해요.", "형광등을 눕혀 관의 긴 옆면을 구에 살며시 가까이 대요. 끝의 금속 단자를 구에 대지 않아요.", "관을 계속 받친 상태에서 손을 가운데로 옮겨 빛나는 구간을 비교해요.", "구와 손 사이를 가리키며 관찰한 만큼 설명하고, 관을 전용 받침에 내려놓아요."], "safety": ["진행자와 함께 유리를 받치며 짧게 시연해요. 구의 같은 곳에 오래 대거나 세게 누르지 않아요.", "금속 단자를 구에 대지 않아요. 금·파손·열감·따가움이 있으면 즉시 멈추고 교사에게 알려요.", "유리가 깨지면 사람을 물리고 교사를 불러요. 학생이 맨손으로 파편을 줍지 않아요."], "myth": "형광등은 플라즈마볼의 빛을 관 끝까지 운반하는 관이 아니에요. 손이 빛을 막거나, 전자가 유리를 뚫고 흐른다고 설명하지 않아요. 손 너머의 전기장이 정확히 0이라고 단정하지도 않아요.", "script": "구 가까이 대니 형광등이 켜지죠? 변하는 전기장이 관에 에너지를 전달해요. 이번에는 잡는 손을 가운데로 옮겨 볼게요. 구와 손 사이가 주로 빛나네요. 손이 빛을 가린 게 아니라, 손과 몸이 전기적 연결 조건을 바꾸어 빛나는 구간이 달라진 거예요.", "faq": [{"q": "가운데를 잡으면 왜 손 너머는 어두워져요?", "a": "손이 관 속 전하와 유리를 사이에 두고 영향을 주고받으며 주변과의 연결 조건을 바꿔요. 이번 배치에서는 주로 구와 손 사이에서 방전이 유지되고, 손 너머는 빛을 낼 조건이 약해지는 것으로 설명할 수 있어요."}, {"q": "유리는 전기가 잘 통하지 않는데 어떻게 영향을 주나요?", "a": "유리를 사이에 둔 양쪽 전하가 서로 영향을 줄 수 있어요. 축전기와 비슷한 용량성 결합이에요. 전자가 유리를 뚫고 지나가는 전선 연결을 뜻하지 않아요."}, {"q": "손으로 빛을 막아서 어두운 것 아닌가요?", "a": "관 안의 각 부분이 에너지를 받아 빛을 내요. 손은 빛의 통로를 막는 마개가 아니라, 관 안에서 빛을 내는 전기적 조건에 영향을 주어요."}], "welcome": "제가 형광등을 받칠게요. 구는 세워 두고 관을 눕혀 긴 옆면을 가까이 대 봐요. 어디가 빛날까요?", "explainAfter": "먼 끝을 잡았을 때와 가운데를 잡았을 때, 빛나는 구간이 어떻게 달랐나요? 구와 손 사이를 함께 찾아볼까요?", "audience": {"young": "구 가까이에서 형광등이 에너지를 받아 빛나요. 손도 전기의 움직임에 영향을 줘요. 잡는 곳을 바꾸면 빛나는 구간이 달라질 수 있어요.", "older": "플라즈마볼 주변의 변하는 전기장이 관에 에너지를 전달해요. 손과 몸은 전기적으로 연결되는 조건을 바꿔요. 이 배치에서는 가운데를 잡으면 주로 구와 손 사이가 빛날 수 있어요. 손으로 빛을 막은 건 아니에요.", "teen": "빠르게 변하는 전기장이 형광등에 에너지를 전해 관 속 방전과 형광 물질을 통해 빛이 나요. 손과 몸은 유리를 사이에 둔 용량성 결합에 참여해 관의 전기적 조건을 바꿔요. 그래서 가운데를 잡으면 구와 손 사이에서 주로 방전이 유지되는 모습을 볼 수 있어요. 실제 밝기는 배치에 따라 달라지며, 전자가 유리를 뚫고 흐른다는 뜻은 아니에요."}}, {"id": "train", "title": "코일 열차", "zone": "터널 열차", "question": "바퀴 없는 건전지 열차가 손으로 밀지 않아도 달릴까요?", "principle": "건전지 양 끝의 자석이 피복 없는 구리 코일에 닿으면 그 사이 코일에 전류가 흘러요. 전류가 만든 자기장과 자석이 서로 힘을 주고받아 열차가 움직여요. 자석은 접촉을 이어 주는 역할도 해요. 열차가 멈춰도 전류가 흐를 수 있고, 이 구성은 전류가 많이 흘러 열이 날 수 있어요.", "steps": ["교사가 작동을 확인한 건전지·자석 열차와 코일을 준비하고 출구를 비워요.", "자석과 코일의 접촉 위치를 보여 준 뒤 열차를 입구에 살며시 넣고 손을 놓아요.", "손으로 계속 밀지 않아도 움직이는지 관찰하게 해요.", "출구에 도착하거나 도중에 멈추면 진행자가 바로 분리해요. 코일 밖에 두고 열과 손상을 확인해요."], "safety": ["열차를 코일 안에 보관하지 않아요. 멈췄을 때도 바로 꺼내고, 안전하게 다루기 어려우면 교사를 불러요.", "자석을 분해하거나 서로 충돌시키지 않아요. 손 끼임과 입에 넣는 행동을 막아요.", "접촉·배치 점검은 열차를 꺼내 식힌 뒤에 해요. 실제 장치의 검증된 배치를 유지해요."], "myth": "열차가 멈췄다고 전류도 끊긴 것은 아니에요. 자석 배치와 접촉이 맞아야 움직이며, 코일 안에 둔 채 손으로 밀어 해결하지 않아요.", "script": "바퀴도 없는데 건전지가 달리죠? 양 끝 자석이 구리선에 닿으면 코일에 전류가 흐르고 자기장이 생겨요. 그 자기장과 자석이 서로 힘을 주고받아 열차가 움직여요. 멈춰도 전류가 흐를 수 있으니, 멈추면 제가 바로 꺼낼게요.", "faq": [{"q": "건전지만 넣으면 달리나요?", "a": "이 장치에는 건전지·자석·코일이 함께 필요해요. 자석은 접촉을 잇고 자기력을 받아요."}, {"q": "안 움직이면 계속 밀어 볼까요?", "a": "먼저 코일에서 꺼내요. 멈춰도 전류가 흐를 수 있어 뜨거워질 수 있어요. 식힌 뒤 배치와 접촉을 점검해요."}, {"q": "전선에 색깔 피막이 있어도 되나요?", "a": "이 방식은 자석이 구리선에 전기적으로 닿아야 해요. 접촉 부위에 절연 피막이 있으면 같은 방식으로 작동하지 않아요. 준비된 코일을 사용해요."}], "welcome": "바퀴 없는 열차를 출발시켜 볼까요? 손을 놓고 움직임을 봐요. 멈추면 제가 바로 꺼낼게요.", "explainAfter": "손으로 계속 밀었나요? 건전지 양 끝의 자석은 코일의 어디에 닿아 있었나요?", "audience": {"young": "건전지의 전기가 코일에 흐르면 자석에 힘을 줄 수 있어요. 그 힘으로 열차가 움직여요. 멈췄을 때는 뜨거워질 수 있어서 바로 꺼내야 해요.", "older": "양 끝 자석이 구리선에 닿으면 코일에 전류가 흘러요. 전류가 만드는 자기장과 자석이 힘을 주고받아 열차가 움직여요. 멈춰도 전류가 흐를 수 있으니 코일 밖으로 바로 꺼내요.", "teen": "건전지 양 끝 자석이 피복 없는 구리선에 접촉하면 그 사이 코일에 전류가 흘러요. 전류의 자기장과 자석의 상호작용으로 추진력이 생겨요. 자석은 전기적 접촉을 잇는 역할도 해요. 저항이 작은 경로라 열이 날 수 있으므로 정지하거나 출구에 도착하면 바로 분리해요."}}, {"id": "compass", "title": "황금 나침반", "zone": "터널 열차 · 방향 점검대", "question": "나침반을 돌리지 않고 스위치만 켜면 바늘이 달라질까요?", "principle": "나침반 바늘은 작은 자석이에요. 스위치를 켜 코일에 전류가 흐르면 코일의 자기장이 생겨요. 바늘은 지구와 코일, 주변 물체의 자기장 영향을 함께 받아 방향을 바꿔요. 전류 방향을 반대로 바꾸면 코일이 만드는 자기장 방향도 반대가 돼요. 실제 바늘의 최종 방향과 각도는 장치 배치에 따라 달라져요. 이 활동은 실물 장치로 체험해요.", "steps": ["스위치를 끄고 나침반을 평평하게 놓아요. 주변의 다른 자석·휴대전화·철제 물체를 치워요.", "바늘이 멎으면 N극이 가리키는 쪽을 함께 확인해요.", "스위치를 잠깐 켜고 N극이 움직이는 쪽을 관찰한 뒤 꺼요.", "꺼진 뒤 방향을 다시 비교해요. 연결을 바꿀 때는 전원을 끄고 교사가 확인한 방식으로 진행해요."], "safety": ["스위치는 관찰할 동안만 잠깐 켜고, 체험이 끝나면 꺼요.", "연결 변경은 전원을 끈 뒤 진행자가 해요. 코일·전지에 열이 나면 사용을 멈춰요.", "방향을 맞추려고 나침반 전체를 손으로 돌리지 않아요. 바늘이 안정되기를 기다려요."], "myth": "바늘이 언제나 코일 쪽이나 같은 왼쪽으로 움직인다고 외우지 않아요. 지구 자기장과 장치 배치가 함께 영향을 줘요. 스위치 없이 나침반 통을 돌린 결과와도 구분해요.", "script": "빨간 N극이 어디를 보는지 기억해 주세요. 스위치를 잠깐 켜 볼게요. 바늘이 달라졌죠? 코일의 전류가 자기장을 만들었기 때문이에요. 바늘은 지구와 코일의 영향을 함께 받아요. 이제 끄고 어떻게 달라지는지 비교해 보세요.", "faq": [{"q": "바늘은 코일 쪽으로 끌려가나요?", "a": "방향을 바꾸는 모습을 봐요. 전류 방향과 코일의 배치, 지구 자기장이 함께 작용하므로 한쪽 방향으로 고정해 말하지 않아요."}, {"q": "전지 연결을 반대로 하면 어떻게 되나요?", "a": "전류 방향이 바뀌면 코일의 자기장 방향도 반대가 돼요. 전원을 끈 뒤 진행자가 연결을 바꾸고 실제 N극의 변화를 관찰해요."}, {"q": "바늘이 계속 흔들리면 바로 켜도 되나요?", "a": "먼저 안정되기를 기다려요. 켜기 전 방향을 알아야 코일 전류 때문에 어떻게 달라졌는지 비교하기 좋아요."}], "welcome": "황금 나침반의 방향 신호를 확인해 봐요. 바늘이 멎으면 스위치를 잠깐 켜 볼게요.", "explainAfter": "나침반 통을 돌리지 않았는데 N극이 움직였나요? 스위치를 끈 뒤에는 어떻게 달라졌나요?", "audience": {"young": "나침반 바늘은 작은 자석이에요. 코일에 전기가 흐르면 바늘에 영향을 줘서 방향이 달라져요. 이제 끄고 다시 비교해 봐요.", "older": "코일에 전류가 흐르면 자기장이 생겨요. 작은 자석인 바늘은 그 영향을 받아 방향을 바꾸어요. 지구의 자기장도 함께 작용하므로 언제나 같은 쪽으로 움직인다고 외우지는 않아요.", "teen": "나침반 바늘은 지구와 코일이 만드는 자기장의 영향을 함께 받아요. 전류를 켜면 코일 자기장이 더해져 바늘의 방향이 달라질 수 있어요. 전류 방향을 반대로 하면 코일 자기장도 반대가 되지만, 최종 각도는 배치에 따라 달라져요. 연결 변경은 전원을 끄고 진행자가 해요."}}, {"id": "eddy", "title": "구리관 전자기 브레이크", "zone": "자이로드롭 통로", "question": "자석이 철처럼 붙지 않는 구리가, 움직이는 자석을 늦출 수 있을까요?", "principle": "구리관에 자석을 가만히 대면 철처럼 달라붙지 않아요. 하지만 자석이 움직이면 구리를 지나는 자기장이 변해 빙 도는 전류, 즉 와전류가 생겨요. 그 전류가 만든 자기력은 이 낙하 실험에서 자석의 움직임을 늦추는 쪽으로 작용해요. 자석이 구리에 붙어서 정지한 것이 아니라 내려오는 동안 전자기 제동을 받는 거예요. 낙하 에너지 일부는 열로 바뀌어요.", "steps": ["구리관을 안정되게 세우고 아래 받침을 비워요. 앞 체험의 자석이 회수되었는지 확인해요.", "진행자와 함께 자석을 구리관 옆에 가만히 대어 철처럼 붙는지 살펴요.", "검증된 장치의 방법에 따라 구리관 위쪽에서 자석을 놓고 도착할 때까지 관찰해요.", "움직일 때 느려지는 현상을 설명한 뒤 자석을 회수해요. 이 실험에는 아크릴관 비교가 필요하지 않아요."], "safety": ["관 아래에 손이나 얼굴을 넣지 않아요. 자석은 아래 받침으로 받아요.", "앞 자석을 회수한 다음에만 다음 체험을 시작해요. 나오지 않으면 더 넣지 말고 교사를 불러요.", "자석을 입에 넣거나 서로 세게 충돌시키지 않아요. 관이 넘어지지 않도록 받침을 확인해요."], "myth": "느려졌다는 사실이 구리에 철처럼 붙었다는 뜻은 아니에요. 자석이 영원히 떠 있는 것도 아니고, 유도 자기장이 모든 위치에서 원래 자기장과 정반대라는 뜻도 아니에요.", "script": "가만히 대면 구리는 철처럼 붙지 않죠? 그런데 자석이 움직이면 구리에 빙 도는 전류가 생겨요. 그 전류가 만드는 자기력은 자석의 움직임을 늦춰요. 그래서 붙어서 멈춘 게 아니라 천천히 내려오는 거예요. 자이로드롭의 전자기 브레이크와 연결되는 원리예요.", "faq": [{"q": "구리에 붙어서 느린 건가요?", "a": "이번 현상은 움직임 때문에 생긴 전류의 자기력이 운동을 늦추는 거예요. 가만히 대었을 때 철처럼 붙는지와 비교해 보세요."}, {"q": "전지가 없는데 전류가 생겨요?", "a": "자석의 움직임으로 구리를 지나는 자기장이 달라지면 전류가 생길 수 있어요. 내려오는 에너지 일부가 열로 바뀌어요."}, {"q": "자석이 안 나오면 다른 자석으로 밀까요?", "a": "더 넣지 않아요. 다음 체험을 멈추고 담당 교사를 불러 걸림과 장치를 확인해요."}], "welcome": "구리관의 브레이크를 확인해 볼까요? 자석을 놓으면 아래 받침에 도착할 때까지 기다려요.", "explainAfter": "자석을 구리에 가만히 댔을 때 철처럼 붙었나요? 움직이며 내려올 때는 어떤 모습을 보았나요?", "audience": {"young": "구리는 철처럼 자석에 붙지 않죠? 그런데 자석이 움직이면 구리에 전류가 생기고, 그 전류가 자석을 천천히 내려오게 하는 힘을 만들어요.", "older": "자석이 움직이면 구리를 지나는 자기장이 달라져 빙 도는 전류가 생겨요. 그 전류의 자기력이 자석의 움직임을 늦춰요. 붙잡혀 멈춘 것이 아니라 내려오는 동안 브레이크가 작용하는 거예요.", "teen": "움직이는 자석 때문에 구리를 지나는 자기장이 변하면 와전류가 생겨요. 그 전류가 만든 자기력은 이 낙하에서 운동을 방해하는 쪽으로 작용해요. 낙하 에너지 일부는 열로 바뀌어요. 구리관에서 관찰하는 전자기 제동은 자이로드롭의 자기 브레이크와 연결되는 원리예요."}}, {"id": "dram", "title": "RAM 한 조각 만들기", "zone": "중앙 제어실", "question": "쓰기 버튼에서 손을 떼고도 기억한 신호를 다시 꺼내 볼 수 있을까요?", "principle": "RAM은 컴퓨터가 지금 쓸 자료를 펼쳐 놓는 작업 책상에 비유할 수 있어요. 널리 쓰이는 DRAM에는 0 또는 1을 구별하는 작은 기억 칸이 많아요. 우리 작품은 그 한 칸의 전하 저장 원리를 큰 부품으로 보여 주는 1비트 DRAM 원리 모형이에요. 축전기를 물통이라고 생각해요. 쓰기는 물 채우기, 두 버튼에서 손 떼기는 잠시 담아 두기, 읽기는 물을 흘려 물레 대신 LED를 켜 보는 일과 비슷해요. 읽는 동안 저장 전하가 줄어들어요. 두 버튼을 놓아 LED가 꺼져도 기억은 남을 수 있어요. 실제 DRAM 셀은 보통 축전기 하나와 트랜지스터 하나로 이루어지고, 셀 밖 감지 회로가 값을 읽고 복원해요. 우리 버튼 두 개가 트랜지스터 두 개를 뜻하지 않으며, LED를 달았다고 반도체 칩을 제조한 것은 아니에요.", "steps": ["전원을 분리한 상태에서 현장에서 검증된 도안으로 조립해요. 교사나 담당 진행자에게 연결·부품 방향을 확인받아요.", "쓰기 버튼만 눌러 축전기를 충전하고, 두 버튼에서 모두 손을 떼요.", "읽기 버튼만 눌러 LED가 켜지는지 봐요. 계속 읽을 때 밝기가 달라지는지도 관찰해요.", "다시 쓰기 → 모두 놓기 → 읽기를 반복하고, 물통 비유로 축전기·버튼·LED의 역할을 설명해요."], "safety": ["연결 검사를 받은 뒤 전원을 연결해요. 열이 나거나 이상하면 전원을 분리하고 담당자에게 알려요.", "쓰기와 읽기를 동시에 누르지 않아요. 축전기의 두 다리를 직접 맞대어 초기화하지 않아요.", "전지와 작은 부품은 고정해 관리하고 입에 넣지 않아요. 배선 변경은 전원을 분리한 뒤 해요."], "myth": "LED가 꺼졌다고 축전기에 전하가 하나도 없다고 결론 내리지 않아요. 실제 DRAM의 리프레시는 원래 0·1을 유지하는 작업이지 모두 1로 채우는 일이 아니에요. 우리 작품은 자동으로 주소를 골라 저장·읽기·복원하는 완성 RAM이나 직접 제조한 반도체 칩이 아니에요.", "script": "컴퓨터 메모리에는 작은 기억 칸이 아주 많아요. 우리는 그 한 칸의 원리를 만들었어요. 축전기를 물통처럼 생각해 보세요. 쓰기로 채우고 손을 떼어 담아 둔 다음, 읽기로 꺼내 LED를 켜요. 꺼내 쓰면 줄어드니 다시 채워야 해요. 실제 칩은 아주 작은 전자 스위치와 축전기, 값을 읽고 유지하는 회로를 사용해요.", "faq": [{"q": "LED가 꺼져 있으면 0인가요?", "a": "두 버튼을 놓아 읽기 길이 끊겨 꺼진 것일 수 있어요. 쓰기를 놓은 상태에서 읽기만 눌러 봐요. 읽는 중 꺼져도 남은 전하가 정확히 0이라고 판정할 수는 없어요."}, {"q": "쓰기와 읽기를 함께 누르면 더 잘 보이지 않나요?", "a": "그렇게 하면 전지가 LED를 직접 켤 수 있어요. 저장했던 전하로 켜진 것인지 보려면 쓰기를 놓은 뒤 읽어야 해요."}, {"q": "이게 실제 반도체의 어느 부분과 닮았나요?", "a": "축전기가 전하를 저장하는 기능은 실제 DRAM 셀의 저장 축전기와 가장 직접적으로 닮았어요. 실제 셀의 전자 스위치는 트랜지스터이며, LED 대신 바깥 감지 회로가 값을 읽어요."}, {"q": "실제 RAM도 다시 채워야 하나요?", "a": "DRAM은 시간이 지나 전하가 새고 읽을 때도 저장 상태에 변화가 생겨요. 원래 0·1을 복원하고 주기적으로 유지하는 리프레시가 필요해요. 모든 칸을 1로 만드는 것이 아니에요."}], "welcome": "마지막으로 기억 한 칸을 만들어 봐요. 도안대로 조립하고 연결을 확인받은 뒤 전원을 연결해요.", "explainAfter": "쓰기 버튼을 놓은 뒤 읽기만 눌러도 LED가 켜졌나요? 두 버튼을 놓고 있을 때 LED가 꺼졌다고 기억도 바로 사라진 걸까요?", "audience": {"young": "축전기를 작은 물통이라고 생각해 봐요. 쓰기로 채우고 손을 떼어 담아 둔 뒤, 읽기로 꺼내 불을 켜요. 우리는 컴퓨터가 기억하는 원리를 큰 부품으로 만든 거예요.", "older": "컴퓨터 메모리에는 0이나 1을 기억하는 작은 칸이 많아요. 우리 작품은 축전기라는 물통에 전하를 담아 기억 한 칸의 원리를 보여 줘요. 쓰기만 누르고 모두 놓은 뒤 읽기만 눌러 확인해요. LED가 꺼져 있어도 물통에 물이 남듯 전하는 남을 수 있어요.", "teen": "우리 작품은 축전기로 전하를 저장하고 읽는 1비트 DRAM 원리 모형이에요. 실제 DRAM 셀은 보통 축전기 하나와 전자 스위치인 트랜지스터 하나로 이루어져요. 셀 밖 감지 회로가 값을 읽고 복원하며 주기적으로 원래 0·1을 유지해요. 우리 두 버튼과 LED가 그 구조와 같은 것은 아니고, 반도체 칩 자체를 제조한 것도 아니에요. 저장 시험은 쓰기만 → 모두 놓기 → 읽기만 순서예요."}}], "pairedPractice": [{"step": 1, "title": "같은 실험을 먼저 익히기", "action": "A와 B가 함께 원리·진행 순서·안전 안내를 읽어요. A는 방문객, B는 진행자가 돼요. 초등 저학년·고학년·중학생 중 이번 방문객의 나이를 정해요."}, {"step": 2, "title": "맞이하고 체험 안내하기", "action": "B는 시작말과 예상 질문을 건네요. 만지는 곳·기다릴 곳·멈출 조건을 알려 주고 체험을 도와요. A는 방문객처럼 행동하고 궁금한 점을 물어요."}, {"step": 3, "title": "관찰한 뒤 원리 설명하기", "action": "B는 방금 무엇이 달라졌는지 묻고, A가 답하면 그 관찰에 원리를 연결해요. 나이에 맞는 쉬운 말로 설명한 뒤 장치를 안전하게 정리해요. 모르는 질문은 교사에게 확인해요."}, {"step": 4, "title": "서로 알려 주고 다시 말하기", "action": "A는 안전 안내·체험 진행·원리의 정확성·나이에 맞는 말 네 가지를 돌아봐요. 이해된 말 하나와 어려웠던 말 하나를 알려 주면 B가 그 부분을 다시 설명해요."}, {"step": 5, "title": "역할과 방문객 나이 바꾸기", "action": "이번에는 B가 방문객, A가 진행자가 되어 같은 흐름을 연습해요. 일곱 실험을 모두 살펴보고 두 사람 모두 안전·진행·원리·나이 맞춤 설명을 연습해요. 실물 연습은 교사가 안내한 순서로 해요."}], "visitorFlow": [{"step": 1, "title": "반갑게 맞이하기", "action": "HNR Tech Inc.에 온 방문객에게 인사해요. 앞으로 할 활동과 기다릴 자리를 짧게 안내하고, 장치를 만지기 전에 진행자의 설명을 듣도록 알려 줘요."}, {"step": 2, "title": "안전하게 직접 체험하기", "action": "실험마다 예상 질문 하나와 구체적인 안전 행동을 알려 줘요. 방문객이 직접 변화를 관찰하도록 돕고, 장치에 이상이 있으면 체험을 멈춰요."}, {"step": 3, "title": "방금 본 원리 알아보기", "action": "체험이 끝나면 무엇이 달라졌는지 먼저 물어요. 방문객의 나이에 맞춰 원리를 설명하고 질문을 들어요. 정리가 끝나면 다음 활동을 안내해요."}, {"step": 4, "title": "RAM 작품 완성하고 받기", "action": "마지막에 RAM 한 조각을 만들어요. 각 실험과 RAM의 원리 설명을 들었는지 함께 확인해요. 쓰기만 → 모두 놓기 → 읽기만으로 작동을 확인하고 부품·전지 고정과 안전을 살펴요. 사용·보관 안내까지 마친 뒤 자신의 작품을 가져가요."}]}</script><script>/* HNR Tech Inc. — local voice practice. No microphone access until start(). */

 ${section('실험별 공부 자료',stationCards(),'각 카드에서 학생용 정리와 방문객에게 보여 줄 설명 HTML을 바로 열 수 있어요.')}

 function resources(){return section('설명할 때 꺼내 쓰는 자료',`<div class="resource-list"><div class="resource-row"><strong>부스 설명용 HTML</strong><p>체험을 마친 방문객과 함께 보는 원리 설명 화면. 각 실험의 조작형 시뮬레이터도 들어 있어요.</p>${openLink('../explain/index.html','열기')}</div><div class="resource-row"><strong>책상용 설명·회로 안내</strong><p>실험 안내와 플라즈마·RAM의 자세한 설명. 프린트하거나 화면에서 확인해요. PDF 22쪽.</p>${openLink('resources/desk-guide.pdf','PDF 열기')}</div><div class="resource-row"><strong>교사·학생 운영 가이드</strong><p>체험 준비와 현장 운영을 함께 확인해요. PDF 6쪽.</p>${openLink('resources/operations.pdf','PDF 열기')}</div><div class="resource-row"><strong>PROJECT ONE 연구소 맵</strong><p>우리 부스의 장소와 이야기를 살펴봐요. 실제 실험 진행은 현장 안전 안내를 따라요.</p>${openLink('../lab.html','맵 열기')}</div></div><details><summary>실험대 표지와 부스 게시물도 보기</summary><div class="actions">${openLink('resources/station-signs.pdf','실험대 표지 7종')}${openLink('resources/posters.pdf','부스 포스터 6종')}${openLink('resources/notices.pdf','현장 안내 표찰')}</div></details>`);}

 ${section('체험 뒤, 관찰에서 설명으로',`<div class="panel"><span class="step-num">방금 본 것을 먼저 물어봐요</span><h3>“${esc(s.explainAfter)}”</h3><p>방문객의 말을 들은 뒤 아래 표현을 골라 설명해요. 학년은 참고만 하고, 이미 아는 것과 궁금한 것에 맞춰 말을 바꿔요.</p>${audienceBlock(s)}</div><div class="notice"><strong>이 말은 꼭 정확하게</strong><p>${esc(s.myth)}</p></div>`)}
 ${section('자주 듣는 질문',`<div class="details-list">${s.faq.map(x=>`<details><summary>${esc(x.q)}</summary><p>${esc(x.a)}</p></details>`).join('')}</div>`)}

 function ram(){return `<div class="wrap"><header class="ram-lede"><div><span class="eyebrow">ONE BIT, ONE MEMORY CELL</span><h1>우리가 만드는<br>RAM 한 조각은?</h1><p class="lead"><strong>전기를 잠시 담아 두었다가 읽어 보는,<br>‘1비트 DRAM 원리 모형’</strong>이에요.<br>컴퓨터 속 아주 작은 기억 칸의 원리를 손으로 만질 수 있는 큰 부품으로 만들어 봐요.</p><div class="actions">${openLink('../explain/dram.html','만들기 전 함께 볼 설명 HTML','button')}${openLink('resources/desk-guide.pdf#page=19','RAM 비유·회로 PDF','button secondary')}</div></div><div class="bit-tile"><div class="bits">0 / 1</div><b>한 칸에 둘 중 하나.</b><p>1비트는 0 또는 1 한 가지를 나타내는<br>정보의 작은 단위예요.<br>한 칸만으로 사진이나 문장을 담지는 못해요.</p></div></header>
 ${section('컴퓨터의 RAM은 ‘작업 책상’ 같아요.',`<div class="grid"><article class="analogy-card"><span class="step-num">CPU · 작업하는 사람</span><span class="bigword">생각하고 계산해요.</span><p>계산하고 명령을 처리하는 역할이에요. 책상에 꺼내 놓은 자료를 사용해 일을 한다고 생각해 봐요.</p></article><article class="analogy-card"><span class="step-num">RAM · 작업 책상</span><span class="bigword">지금 쓸 것을 펼쳐요.</span><p>실행 중인 프로그램과 지금 필요한 데이터를 빠르게 꺼내 쓰는 작업 공간이에요. 일반적인 DRAM은 전원이 끊기면 내용을 유지하지 못해요.</p></article><article class="analogy-card"><span class="step-num">SSD · 자료를 보관하는 책장</span><span class="bigword">나중에도 꺼내 봐요.</span><p>프로그램과 저장한 파일을 오래 보관해요. 전원을 꺼도 남겨 둘 자료는 이런 저장장치에 저장해요.</p></article></div><div class="notice"><strong>우리 작품은 그 책상 전체가 아니라, 아주 작은 ‘기억 한 칸’의 원리예요.</strong><p>RAM은 메모리의 이름이고, DRAM은 그중 축전기에 전하를 저장하는 방식이에요. 실제 DRAM에는 이런 기억 칸이 매우 많이 모여 있어요. 모든 종류의 RAM이 축전기를 사용하는 것은 아니에요.</p></div>`)}

 ${section('물통으로 ‘쓰기 → 저장 → 읽기’ 이해하기',`<div class="memory-demo"><div class="memory-visual"><div><div class="tank" aria-label="축전기에 남은 전하를 물높이로 비유"><div class="water" id="memoryWater"></div><span class="tank-caption">축전기 = 물통</span></div></div><div><p class="demo-caption">같은 물통에서<br>물높이 ↔ 전압</p><div class="led-line"><span class="led" id="memoryLed"></span><span id="ledLabel">LED 꺼짐</span></div></div></div><div><span class="eyebrow">버튼을 순서대로 눌러 보세요</span><h3 id="memoryHeading">손을 떼면, 빛과 기억은 어떻게 될까요?</h3><p id="memoryText" aria-live="polite">① 쓰기로 채운 다음 ② 두 버튼을 놓아 보세요. LED가 꺼져도 축전기에 전하가 남아 있을 수 있다는 점을 확인해요.</p><div class="segments" role="group" aria-label="메모리 동작"><button data-memory="write" aria-pressed="false">① 쓰기</button><button data-memory="hold" aria-pressed="false">② 손 떼고 저장</button><button data-memory="read" aria-pressed="false">③ 읽기</button></div><button class="quiet" data-memory="reset">처음으로</button></div></div><p class="note" style="margin-top:16px">동작을 이해하는 비유이며 실제 충전 시간·전압·밝기의 측정값은 아니에요. 물통은 전하를 완전히 가둬 두는 장치처럼 보이지만, 실제 축전기에는 누설이 있어 시간이 지나면 저장 상태가 약해질 수 있어요.</p><div class="notice"><strong>LED가 꺼졌다고 곧바로 ‘0’이라고 말하지 않아요.</strong><p>읽기 버튼을 놓아 길이 끊겨 있을 수도 있고, LED를 켤 만큼 전압이 높지 않을 수도 있어요. 0·1은 정해 둔 기준으로 구분하는 상태예요. 실제 DRAM은 작은 전압 차이를 감지 회로로 읽어요.</p></div>`)}
 ${section('반도체 속 DRAM과 어디가 닮았나요?',`<div class="table-wrap" tabindex="0" role="region" aria-label="우리 모형과 실제 DRAM 비교 표, 좁은 화면에서는 옆으로 스크롤"><table class="compare-table"><thead><tr><th>역할</th><th>우리가 만드는 모형</th><th>실제 DRAM</th></tr></thead><tbody><tr><td><strong>저장</strong></td><td>큰 축전기에 전하를 담아요.</td><td>아주 작은 축전기에 전하를 저장해요.</td></tr><tr><td><strong>연결 제어</strong></td><td>두 버튼으로 쓰기·읽기 경로를 나눠 조작해요.</td><td>보통 셀 하나에 트랜지스터 1개가 있어요. 전기 신호로 켜고 끄는 스위치예요.</td></tr><tr><td><strong>읽기</strong></td><td>저장한 에너지로 LED를 켜요. 읽는 동안 전하가 줄어요.</td><td>셀 밖 감지 회로가 미세한 차이를 구별해 0·1을 읽고, 읽은 상태를 다시 복원해요.</td></tr><tr><td><strong>오래 유지</strong></td><td>자동 복원 장치가 없어요. 충전한 뒤 읽기와 방전을 관찰해요.</td><td>누설로 약해지는 정보를 주기적으로 다시 유지해요. 이것이 리프레시예요.</td></tr><tr><td><strong>크기·구조</strong></td><td>손으로 만질 수 있는 부품을 연결한 교육 모형이에요.</td><td>반도체 칩 안에 많은 셀과 선택·감지·제어 회로가 함께 있어요.</td></tr></tbody></table></div><div class="grid two" style="margin-top:22px"><div class="panel pale"><span class="step-num">1T1C</span><h3>트랜지스터 1개 + 축전기 1개</h3><p>일반적인 DRAM 셀의 기본 구성이에요. <strong>우리 모형의 버튼 두 개와 LED</strong>가 실제 셀에 그대로 들어가지는 않아요. LED는 읽는 모습을 보여 주려고 붙인 부품이에요.</p></div><div class="panel pale"><span class="step-num">REFRESH</span><h3>원래 기억을 다시 살려 줘요.</h3><p>리프레시는 모든 칸을 꽉 채워 1로 만드는 일이 아니에요. 원래 0이던 칸은 0으로, 1이던 칸은 1로 유지하도록 해요. 우리 모형에는 이 자동 기능이 없어요.</p></div></div><div class="notice"><strong>“반도체 칩을 만들었어요”보다 이렇게 말해요.</strong><p>“반도체 메모리 안의 <b>기억 한 칸이 작동하는 원리</b>를 큰 부품으로 만들었어요. 축전기에 전하를 저장하고 읽는 점이 실제 DRAM과 닮았어요.”</p></div>`)}

 $('#memoryHeading').textContent=text[memoryMode][0];$('#memoryText').textContent=text[memoryMode][1];document.querySelectorAll('[data-memory]').forEach(b=>{if(b.hasAttribute('aria-pressed'))b.setAttribute('aria-pressed',b.dataset.memory===memoryMode)});drawMemory();if(action==='read'&&charge>8){memoryTimer=setInterval(()=>{charge=Math.max(8,charge-2);drawMemory();if(charge<=8){clearInterval(memoryTimer);memoryTimer=null;$('#memoryText').textContent='읽는 동안 전하가 줄어 LED가 꺼졌어요. 실제 DRAM은 읽은 0·1을 복원하지만, 우리 모형은 자동 복원하지 않아요. 다시 쓰기로 충전해 볼 수 있어요.'}},120);}}

 document.addEventListener('click',e=>{const audienceBtn=e.target.closest('[data-audience]');if(audienceBtn){audience=audienceBtn.dataset.audience;const area=audienceBtn.closest('.audience'),s=stations.find(s=>s.id===area.dataset.station);area.querySelectorAll('[data-audience]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.audience===audience));area.querySelector('.audience-output').textContent='“'+s.audience[audience]+'”';}
