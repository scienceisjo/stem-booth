<script id="course-data" type="application/json">{"stations": [{"id": "energy", "title": "에너지스틱", "zone": "실험 ZONE", "question": "손을 놓으면 어떻게 될까?", "principle": "빛과 소리의 에너지는 스틱 안 전지에서 나와. 우리 몸이 연결된 길의 일부가 되면 스틱이 이를 알아차려!", "steps": ["양 끝의 두 사람이 스틱의 금속 부분을 하나씩 잡자!", "옆 사람과 손을 이어 동그란 고리를 만들자!", "한 사람이 손을 놓았다가 다시 잡아 보자. 빛과 소리는 어떻게 달라질까?"], "safety": ["손이나 스틱을 당기지 말자. 콘센트 전기로 따라 하면 안 돼!", "사람을 잇는 실험은 제공된 에너지스틱으로만 해요. 콘센트나 다른 전원에 연결하지 않아요.", "잘 작동하지 않아도 손에 물이나 침을 묻히지 않아요.", "손이나 스틱을 세게 당기지 않고, 원하지 않는 방문객에게 손잡기를 강요하지 않아요."], "myth": "사람들이 전기를 만들어서 켜지는 것이 아니에요. 에너지원은 내부 전지이고 몸은 감지 경로의 일부예요. 스틱이 조용해졌다고 전지가 즉시 소모됐다고 판단하지 않아요.", "script": "빛과 소리의 에너지는 스틱 안 전지에서 나와. 우리 몸이 연결된 길의 일부가 되면 스틱이 이를 알아차려!", "faq": [{"q": "전기는 우리 몸에서 만들어지나요?", "a": "스틱 안 전지가 공급해요. 몸은 연결된 경로의 일부가 돼요."}, {"q": "손을 놓으니 왜 조용해졌나요?", "a": "고리가 끊겨 스틱이 이어진 경로를 감지하지 못하기 때문이에요. 접촉을 다시 이었을 때도 비교해 보세요."}, {"q": "손에 물을 묻히면 더 잘될까요?", "a": "이 부스에서는 물을 묻히지 않아요. 금속 접촉부와 손 연결을 먼저 살피고, 계속 반응이 없으면 진행자가 장치를 점검해요."}], "welcome": "양 끝의 두 사람이 스틱의 금속 부분을 하나씩 잡자!", "explainAfter": "손을 이을 때와 놓을 때 빛과 소리가 어떻게 달랐나요?", "audience": {"young": "손을 이으니 불과 소리가 났죠? 스틱은 안의 전지로 작동하고, 우리 몸을 포함한 길이 이어졌는지 알아차려요. 손을 놓으면 길이 끊겨요.", "older": "스틱 안 전지가 에너지를 공급해요. 몸과 금속 부분이 한 바퀴 이어지면 아주 작은 전류가 흐르는 연결을 스틱이 감지해요. 한 명이 놓으면 길이 끊겨 빛과 소리가 달라져요.", "teen": "전지는 에너지원이고 몸은 회로의 경로 일부예요. 스틱은 몸을 포함한 닫힌 경로에 작은 감지 전류가 흐르는지 알아차려 빛과 소리를 내요. 손을 놓으면 경로가 끊겨요. 사람이 전기를 만든 것은 아니에요."}, "mode": "본 체험", "reset": ["손을 놓고 스틱을 내려놓아요. 반응이 없으면 접촉부·연결·전지를 확인해요."], "connection": "닫힌 회로와 스위치의 역할을 기억 회로의 S1·S2 조작에 연결해요."}, {"id": "static", "title": "정전기로 캔 굴리기", "zone": "실험 ZONE", "question": "얼마나 가까워지면 캔이 움직일까?", "principle": "대전된 빨대가 캔 속 전자의 분포를 바꿔. 캔의 전체 전하의 합은 그대로지만, 빨대 쪽으로 끌려올 수 있어!", "steps": ["털가죽으로 빨대를 문지르고, 캔에 닿지 않게 천천히 가까이 가져가자!", "캔이 처음 움직일 때, 빨대 표면과 캔 사이의 거리를 측정하자!", "굵기가 다른 빨대도 같은 조건으로 여러 번 비교해 보자!"], "safety": ["재질·길이·문지르는 범위와 횟수·기다리는 시간을 맞추자. 손이나 입김으로 캔을 밀지 말자!", "캔은 책상 가운데에서 굴립니다. 빨대를 얼굴에 겨누지 않아요.", "빨대와 캔을 손으로 밀거나 입김을 불지 않아요."], "myth": "굵은 빨대가 항상 더 많은 전하를 띠거나 더 멀리서 캔을 움직인다고 정답을 정하지 않아요. 이 활동은 전하량·축전용량을 측정하는 실험이 아닙니다. 캔은 처음부터 빨대와 반대 전하를 띤 물체가 아닙니다.", "script": "대전된 빨대가 캔 속 전자의 분포를 바꿔. 캔의 전체 전하의 합은 그대로지만, 빨대 쪽으로 끌려올 수 있어!", "faq": [{"q": "빨대를 손으로 잡으면 전하가 사라지나요?", "a": "플라스틱 빨대는 절연체라 손에 잡았다고 전하가 한꺼번에 모두 빠져나가지는 않아요. 문지른 부분의 접촉이나 손의 습기는 전하 상태에 영향을 줄 수 있으니, 문지르지 않은 끝을 같은 위치에서 잡습니다."}, {"q": "같은 털가죽을 계속 쓰면 잘 안 될 수도 있나요?", "a": "반복 사용 횟수만으로 실패가 정해지는 것은 아닙니다. 털가죽과 빨대의 습기·오염·접촉 상태가 달라지면 대전이 잘 되지 않을 수 있어요. 마른 상태를 확인하고 시험해 봐요."}, {"q": "굵은 빨대가 더 먼 거리에서 움직일까요?", "a": "재질·표면 상태·문지른 범위·전하 분포 등도 영향을 줍니다. 굵기만으로 결과를 정하지 말고 조건을 맞춰 반복 비교해요."}, {"q": "거리 측정 앱은 어떻게 준비하나요?", "a": "카메라를 고정하고 실제 자의 두 눈금으로 길이를 보정해요. 캔·빨대·고정 표시를 지정한 뒤 자동 측정을 시작해요. 준비 완료 후 천천히 접근하고, 감지된 화면을 확인해요. 추적 실패나 카메라 움직임이 있으면 다시 설정해요."}], "welcome": "털가죽으로 빨대를 문지르고, 캔에 닿지 않게 천천히 가까이 가져가자!", "explainAfter": "어느 빨대에서 더 먼 거리부터 움직였나요? 순서를 바꿔도 비슷했나요?", "audience": {"young": "닿지 않았는데 캔이 따라왔죠? 문지른 빨대가 전기적인 힘으로 캔을 끌어당겼어요. 빨대로 밀어서 움직인 건 아니에요.", "older": "문지른 빨대에는 전하가 모일 수 있어요. 가까이 대면 캔 속 전하의 자리가 달라지고, 가까운 쪽을 끌어당기는 효과가 더 커져요. 그래서 닿지 않아도 캔이 따라와요.", "teen": "대전된 빨대를 가까이 대면 금속 캔의 전자 분포가 달라져요. 가까운 쪽의 인력이 더 크게 작용해 중성이던 캔도 끌려올 수 있어요. 캔 전체가 처음부터 반대 전하였다는 뜻은 아니에요. 접촉이나 입김 없이 움직였는지 확인하는 것이 중요해요."}, "mode": "본 체험", "reset": ["같은 캔과 출발 위치를 맞춥니다. 빨대·털가죽의 습기와 오염을 확인하고, 문지른 뒤 실험까지의 시간을 맞춥니다."], "connection": "전하와 전기적 힘을 관찰하는 활동이에요. 빨대의 굵기 비교를 축전용량 비교로 설명하지 않아요."}, {"id": "plasma", "title": "마법구슬? 아니! 플라즈마!", "zone": "실험 ZONE", "question": "전선을 연결하지 않은 형광등이 빛난다고?", "principle": "빠르게 변하는 전기장이 형광등에 에너지를 전달해. 전자가 유리벽을 뚫고 지나가는 건 아니야!", "steps": ["형광등의 유리 부분을 잡으세요.", "형광등의 긴 옆면을 구에 살며시 가까이 대어보자. 어떤 일이 일어날까?", "잡는 위치를 바꾸며 빛나는 구간을 살펴보자!"], "safety": ["금속 단자를 만지지 말자. 유리에 충격을 주거나 오래 대고 있지 말자!", "진행자와 함께 유리를 받치며 짧게 시연해요. 구의 같은 곳에 오래 대거나 세게 누르지 않아요.", "금속 단자를 구에 대지 않아요. 금·파손·열감·따가움이 있으면 즉시 멈추고 교사에게 알려요.", "유리가 깨지면 사람을 물리고 교사를 불러요. 학생이 맨손으로 파편을 줍지 않아요."], "myth": "형광등이 플라즈마볼의 빛을 단순히 반사한 것은 아니에요. 빠르게 변하는 전기장이 관 안의 기체에 에너지를 전달해요. 에너지스틱의 표시등은 내부 전지로 켜지므로 두 기구의 전원 구조가 같다고 설명하지 않아요.", "script": "빠르게 변하는 전기장이 형광등에 에너지를 전달해. 전자가 유리벽을 뚫고 지나가는 건 아니야!", "faq": [{"q": "전선을 연결하지 않았는데 왜 켜지나요?", "a": "플라즈마볼 주변의 빠르게 변하는 전기장이 관 안의 전하에 작용해 기체에 에너지를 전달해요. 관 안에서 생긴 자외선을 형광 물질이 눈에 보이는 빛으로 바꿔요."}, {"q": "에너지스틱도 같은 전기로 켜지나요?", "a": "가까이에서 전기장의 영향을 받는다는 단서는 같아요. 다만 에너지스틱은 미세한 전류를 감지하고 내부 전지로 표시등과 소리를 내요."}, {"q": "언제나 같은 거리에서 켜지나요?", "a": "기구의 종류와 주변 조건에 따라 달라져요. 오늘 사용한 장치에서 가까이와 멀리를 직접 비교해요."}], "welcome": "형광등의 유리 부분을 잡으세요.", "explainAfter": "에너지스틱을 켰던 조건을 형광등에도 적용했나요? 가까이와 멀리에서 빛이 어떻게 달랐나요?", "audience": {"young": "에너지스틱을 가까이 가져가니 불이 켜졌어요! 플라즈마볼 주변에는 보이지 않는 전기의 영향이 있어요. 이 단서를 생각해서 형광등도 가까이 가져가 볼까요? 형광등은 그곳에서 에너지를 전달받아 빛나요.", "older": "에너지스틱이 플라즈마볼 가까이에서 켜졌어요. 빠르게 변하는 전기장의 영향으로 미세한 전류가 흐르는 것을 감지한 거예요. 형광등도 가까이 가져가면 관 안의 기체가 에너지를 받아 빛을 만들어요. 스틱의 표시등은 내부 전지로 켜진다는 차이가 있어요.", "teen": "플라즈마볼 주변에는 빠르게 변하는 전기장이 있어요. 가까운 에너지스틱은 미세한 전류를 감지하고 내부 전지로 표시등을 켜요. 이 단서로 형광등을 가까이 가져가면 전기장이 관 안의 전하에 작용해 기체에 에너지를 전달해요. 기체에서 생긴 자외선을 관 안쪽 형광 물질이 눈에 보이는 빛으로 바꿔요."}, "mode": "본 체험", "reset": ["기구를 끄고 유리와 받침 상태를 확인해요. 다음 참가자에게 에너지스틱 점등 단서부터 안내해요."], "connection": "거리 변화로 형광등을 켜고, 암호 ‘가까이’를 확인하면 회로 제작대로 안내해요."}, {"id": "train", "title": "코일 열차", "zone": "접수 ZONE · 자유 체험", "question": "바퀴도 없는데 어떻게 달릴까?", "principle": "건전지가 에너지를 공급해. 전류가 흐르는 코일과 자석이 힘을 주고받으면 열차가 움직여!", "steps": ["건전지와 양 끝의 자석을 살펴보자!", "연구원의 신호에 맞춰 코일 입구에 열차를 넣고 손을 놓자!", "열차가 움직이는 모습을 관찰하자! 출구에 도착하면 연구원에게 알려 주자."], "safety": ["멈춰도 전류가 흐를 수 있어! 멈추면 바로 알리고, 코일 안에 넣은 채 두지 말자. 자석을 입에 넣거나 분해하지 말자!", "열차를 코일 안에 보관하지 않아요. 멈췄을 때도 바로 꺼내고, 안전하게 다루기 어려우면 교사를 불러요.", "자석을 분해하거나 서로 충돌시키지 않아요. 손 끼임과 입에 넣는 행동을 막아요.", "접촉·배치 점검은 열차를 꺼내 식힌 뒤에 해요. 실제 장치의 검증된 배치를 유지해요."], "myth": "열차가 멈췄다고 전류도 끊긴 것은 아니에요. 자석 배치와 접촉이 맞아야 움직이며, 코일 안에 둔 채 손으로 밀어 해결하지 않아요.", "script": "건전지가 에너지를 공급해. 전류가 흐르는 코일과 자석이 힘을 주고받으면 열차가 움직여!", "faq": [{"q": "건전지만 넣으면 달리나요?", "a": "이 장치에는 건전지·자석·코일이 함께 필요해요. 자석은 접촉을 잇고 자기력을 받아요."}, {"q": "안 움직이면 계속 밀어 볼까요?", "a": "먼저 코일에서 꺼내요. 멈춰도 전류가 흐를 수 있어 뜨거워질 수 있어요. 식힌 뒤 배치와 접촉을 점검해요."}, {"q": "전선에 색깔 피막이 있어도 되나요?", "a": "이 방식은 자석이 구리선에 전기적으로 닿아야 해요. 접촉 부위에 절연 피막이 있으면 같은 방식으로 작동하지 않아요. 준비된 코일을 사용해요."}], "welcome": "건전지와 양 끝의 자석을 살펴보자!", "explainAfter": "밀지 않아도 열차가 움직이는 모습을 확인하세요.", "audience": {"young": "건전지의 전기가 코일에 흐르면 자석에 힘을 줄 수 있어요. 그 힘으로 열차가 움직여요. 멈췄을 때는 뜨거워질 수 있어서 바로 꺼내야 해요.", "older": "양 끝 자석이 구리선에 닿으면 코일에 전류가 흘러요. 전류가 만드는 자기장과 자석이 힘을 주고받아 열차가 움직여요. 멈춰도 전류가 흐를 수 있으니 코일 밖으로 바로 꺼내요.", "teen": "건전지 양 끝 자석이 피복 없는 구리선에 접촉하면 그 사이 코일에 전류가 흘러요. 전류의 자기장과 자석의 상호작용으로 추진력이 생겨요. 자석은 전기적 접촉을 잇는 역할도 해요. 저항이 작은 경로라 열이 날 수 있으므로 정지하거나 출구에 도착하면 바로 분리해요."}, "mode": "자유 체험", "reset": ["출구에 도착하거나 멈추면 연구원이 바로 열차를 꺼내요. 전지·자석·코일의 발열과 손상을 확인해요."], "connection": "접수 책상 절반에서 운영하는 예약 없는 전자기 자유 체험이에요. 추가 비교 질문이나 DRAM 필수 완료 조건을 붙이지 않아요."}, {"id": "eddy", "title": "전자기 브레이크, 자이로드롭이 멈추는 원리?!", "zone": "접수 ZONE · 자유 체험", "question": "끊어진 관에서도 어떻게 속도가 느려질까?", "principle": "틈이 있어도 금속 안의 유도 전류가 모두 없어지지는 않아. 아래 구리판에도 전류가 생길 수 있어. 어느 구간에서 느려지는지 살펴보자!", "steps": ["옆면이 막힌 구리관에 자석을 떨어뜨려 보자!", "원리 화면을 본 뒤, 세로로 틈이 난 관에서는 어떨지 예상해 보자!", "틈이 난 관과 아래 구리판 사이를 지나갈 때, 움직임을 나눠 관찰하자!"], "safety": ["자석이 나오는 곳에 손이나 얼굴을 대지 말자. 자석은 연구원과 함께 다루자!", "관 아래에 손이나 얼굴을 넣지 않아요. 자석은 아래 받침으로 받아요.", "앞 자석을 회수한 다음에만 다음 체험을 시작해요. 나오지 않으면 더 넣지 말고 교사를 불러요.", "자석을 입에 넣거나 서로 세게 충돌시키지 않아요. 관이 넘어지지 않도록 받침을 확인해요."], "myth": "세로 틈은 관 둘레를 도는 전류 경로를 방해해요. 그렇다고 모든 유도 전류가 0이거나 반드시 자유낙하한다고 단정하지 않아요. 아래 구리판에도 유도 전류가 생길 수 있어요.", "script": "틈이 있어도 금속 안의 유도 전류가 모두 없어지지는 않아. 아래 구리판에도 전류가 생길 수 있어. 어느 구간에서 느려지는지 살펴보자!", "faq": [{"q": "에너지스틱은 한 곳이 끊기면 꺼지는데, 절개 관은 어떤가요?", "a": "에너지스틱의 감지 회로와 금속 내부의 유도 전류 경로는 다릅니다. 세로 틈은 관 둘레의 전류 경로를 방해하지만 금속의 다른 부분에 생기는 전류까지 모두 없앤다고 볼 수는 없어요. 실제 낙하를 비교하세요."}, {"q": "구리판 두 개는 어떻게 보나요?", "a": "아래에 마주 보게 세운 두 구리판 사이의 움직임을 관 구간과 구분해 봐요. 지지부가 관의 절개 틈 양쪽을 금속으로 잇는지는 실제 장치에서 확인해야 해요."}, {"q": "예상이 틀리면 다시 고르게 하나요?", "a": "예상은 관찰 전 생각이에요. 먼저 비교 관찰한 뒤 왜 달랐는지 이야기해요. 자유 체험 방문객에게 맵 접속이나 정답 통과를 요구하지 않아요."}], "welcome": "옆면이 막힌 구리관에 자석을 떨어뜨려 보자!", "explainAfter": "끊어진 관에서도 어떻게 속도가 느려질까? 관과 아래 구리판 사이를 나눠 살펴보자!", "audience": {"young": "구리는 철처럼 자석에 붙지 않죠? 그런데 자석이 움직이면 구리에 전류가 생기고, 그 전류가 자석을 천천히 내려오게 하는 힘을 만들어요.", "older": "자석이 움직이면 구리를 지나는 자기장이 달라져 빙 도는 전류가 생겨요. 그 전류의 자기력이 자석의 움직임을 늦춰요. 붙잡혀 멈춘 것이 아니라 내려오는 동안 브레이크가 작용하는 거예요.", "teen": "움직이는 자석 때문에 구리를 지나는 자기장이 변하면 와전류가 생겨요. 그 전류가 만든 자기력은 이 낙하에서 운동을 방해하는 쪽으로 작용해요. 낙하 에너지 일부는 열로 바뀌어요. 구리관에서 관찰하는 전자기 제동은 자이로드롭의 자기 브레이크와 연결되는 원리예요."}, "mode": "자유 체험", "reset": ["자석을 회수하고 받침을 비웁니다. 두 관과 구리판의 고정 상태, 자석이 걸리는 곳을 확인해요."], "connection": "예약 없는 전자기 자유 체험이에요. 맵에서는 선택 체험으로 공간과 설명을 유지해요."}, {"id": "dram", "title": "내 손으로 만드는 반도체의 첫 번째 방(1bit)", "zone": "제작 ZONE · 메인 체험", "question": "전하를 저장해 작은 기억 한 칸을 만들자!", "principle": "축전기에 전하를 저장해 0과 1을 표현하는 원리 모형이야. 기억은 잠시 남고, 읽는 동안 방전돼. 실제 DRAM 칩을 만드는 활동은 아니야.", "steps": ["도안과 매뉴얼을 보고 회로를 만들자! 전원을 켜기 전에는 검사를 받자.", "S1만 눌러 충전하고, 두 버튼에서 모두 손을 떼자!", "곧바로 S2만 눌러 LED가 켜지는 순간을 보자! 다시 읽으려면 먼저 충전하자."], "safety": ["S1과 S2를 동시에 누르지 말자! 0을 준비할 때는 S1을 놓고 S2를 충분히 눌러 먼저 비우자.", "연결 검사를 받은 뒤 전원을 연결해요. 열이 나거나 이상하면 전원을 분리하고 담당자에게 알려요.", "쓰기와 읽기를 동시에 누르지 않아요. 축전기의 두 다리를 직접 맞대어 초기화하지 않아요.", "전지와 작은 부품은 고정해 관리하고 입에 넣지 않아요. 배선 변경은 전원을 분리한 뒤 해요."], "myth": "LED가 꺼졌다고 축전기에 전하가 하나도 없다고 결론 내리지 않아요. 실제 DRAM의 리프레시는 원래 0·1을 유지하는 작업이지 모두 1로 채우는 일이 아니에요. 우리 작품은 자동으로 주소를 골라 저장·읽기·복원하는 완성 RAM이나 직접 제조한 반도체 칩이 아니에요.", "script": "축전기에 전하를 저장해 0과 1을 표현하는 원리 모형이야. 기억은 잠시 남고, 읽는 동안 방전돼. 실제 DRAM 칩을 만드는 활동은 아니야.", "faq": [{"q": "LED가 꺼져 있으면 0인가요?", "a": "두 버튼을 놓아 읽기 길이 끊겨 꺼진 것일 수 있어요. 쓰기를 놓은 상태에서 읽기만 눌러 봐요. 읽는 중 꺼져도 남은 전하가 정확히 0이라고 판정할 수는 없어요."}, {"q": "쓰기와 읽기를 함께 누르면 더 잘 보이지 않나요?", "a": "그렇게 하면 전지가 LED를 직접 켤 수 있어요. 저장했던 전하로 켜진 것인지 보려면 쓰기를 놓은 뒤 읽어야 해요."}, {"q": "이게 실제 반도체의 어느 부분과 닮았나요?", "a": "축전기가 전하를 저장하는 기능은 실제 DRAM 셀의 저장 축전기와 가장 직접적으로 닮았어요. 실제 셀의 전자 스위치는 트랜지스터이며, LED 대신 바깥 감지 회로가 값을 읽어요."}, {"q": "실제 RAM도 다시 채워야 하나요?", "a": "DRAM은 시간이 지나 전하가 새고 읽을 때도 저장 상태에 변화가 생겨요. 원래 0·1을 복원하고 주기적으로 유지하는 리프레시가 필요해요. 모든 칸을 1로 만드는 것이 아니에요."}], "welcome": "내 손으로 반도체의 첫 번째 방을 만들자! 회로가 완성되면 최종 면접에 도전하자!", "explainAfter": "S1을 놓고 S2만 눌렀을 때 LED가 켜지는 순간을 확인하세요.", "audience": {"young": "축전기를 작은 물통이라고 생각해 봐요. 쓰기로 채우고 손을 떼어 담아 둔 뒤, 읽기로 꺼내 불을 켜요. 우리는 컴퓨터가 기억하는 원리를 큰 부품으로 만든 거예요.", "older": "컴퓨터 메모리에는 0이나 1을 기억하는 작은 칸이 많아요. 우리 작품은 축전기라는 물통에 전하를 담아 기억 한 칸의 원리를 보여 줘요. 쓰기만 누르고 모두 놓은 뒤 읽기만 눌러 확인해요. LED가 꺼져 있어도 물통에 물이 남듯 전하는 남을 수 있어요.", "teen": "우리 작품은 축전기로 전하를 저장하고 읽는 1비트 DRAM 원리 모형이에요. 실제 DRAM 셀은 보통 축전기 하나와 전자 스위치인 트랜지스터 하나로 이루어져요. 셀 밖 감지 회로가 값을 읽고 복원하며 주기적으로 원래 0·1을 유지해요. 우리 두 버튼과 LED가 그 구조와 같은 것은 아니고, 반도체 칩 자체를 제조한 것도 아니에요. 저장 시험은 쓰기만 → 모두 놓기 → 읽기만 순서예요."}, "mode": "본 체험", "reset": ["네 회로는 왼쪽부터 8·4·2·1로 놓고 S1을 놓은 상태에서 각 S2를 충분히 눌러 비웁니다. 다음 저장 전 배선·극성을 확인해요."], "connection": "1과 0의 두 상태를 구분한 뒤, 최종 면접에서 네 칸의 신호로 비밀 숫자를 표현해요."}], "pairedPractice": [{"step": 1, "title": "담당 자리 확인", "action": "접수·자유 체험·본 체험·제작·테스트 중 연습할 역할을 정하고, 실제 장치와 안내판 위치를 확인해요."}, {"step": 2, "title": "안전 행동부터 안내", "action": "손을 댈 곳, 연구원이 다룰 곳, 이상하면 멈출 조건을 먼저 말해요. 한 번에 한 행동을 안내해요."}, {"step": 3, "title": "실제 순서로 진행", "action": "정전기는 조건을 맞춰 거리 비교, 브레이크는 닫힌 관 관찰 → 설명 → 예상 → 절개 관 비교 순서로 연습해요. 코일 열차에는 추가 비교 질문을 넣지 않아요."}, {"step": 4, "title": "관찰과 설명 대조", "action": "짝은 실제로 본 현상과 설명이 맞는지 확인해요. 굵은 빨대의 결과나 절개 관의 낙하 속도를 미리 단정하지 않았는지 점검해요."}, {"step": 5, "title": "역할을 바꿔 마무리", "action": "역할을 바꿔 같은 활동을 진행해요. 제작 담당은 네 회로를 잇지 않고 8421 저장·읽기·초기화까지 확인해요."}], "visitorFlow": [{"step": 1, "title": "접수와 출발", "action": "접수에서 본 체험을 안내해요. 학생 연구원이 실험 책상으로 안내하며, 에너지스틱부터 순서대로 시작해요."}, {"step": 2, "title": "본 체험", "action": "에너지스틱 → 정전기 캔 → 플라즈마볼. 참가자는 활동 중 준비된 기기로 맵을 조작하며 현장 이동은 연구원의 안내를 따라요."}, {"step": 3, "title": "회로 제작", "action": "제작 책상에서 도안과 학생 매뉴얼로 1비트 기억 회로를 만들어요. 검사 후 S1만 → 모두 놓기 → S2만 순서로 확인해요."}, {"step": 4, "title": "최종 면접 · 4비트 이진수 연산 테스트", "action": "왼쪽부터 A4 미션판 8·4·2·1을 놓고 회로를 하나씩 올려요. 회로끼리 연결하지 않아요. 감독관의 숫자를 저장한 뒤 곧바로 읽어요. 10은 1010, 즉 8+2예요. 미션판은 자르지 않아요."}], "resources": [{"file": "desk-guide.pdf", "pages": 5, "title": "A4 실험 설명판 5종", "description": "01~05 실험 · 메인 회로판은 별도", "sha256": "30dfc666b24834beeac8a0aab732f0a1c4211a31589867925d17d23ea2047b99"}, {"file": "main-circuit.pdf", "pages": 1, "title": "메인 회로 설명판", "description": "번호 없는 메인 체험", "sha256":   function detectMime(bytes) {

      '<div class="ramc-layout"><figure class="ramc-figure">' + svg(false) + svg(true) + '<figcaption><span class="ramc-key"></span>파란 선: 이 단계에서 충전·방전에 연결되는 경로<br>선은 구리테이프 연결을 간단히 나타냈어요. 축전기의 두 판 사이에는 전류가 통과하지 않아요.</figcaption></figure>' +
      '<div class="ramc-explain"><div class="ramc-scene-copy" aria-live="polite" aria-atomic="true"><h3 data-ramc-title>' + scenes.write.title + '</h3><p data-ramc-text>' + scenes.write.text + '</p><p class="ramc-path-copy" data-ramc-path>' + scenes.write.path + '</p><p class="ramc-detail" data-ramc-detail>' + scenes.write.detail + '</p></div>' +
      '<aside class="ramc-resistor-note"><h3>저항은 왜 필요할까?</h3><p><strong>LED와 저항을 한 줄로, 직렬 연결</strong>해요. 같은 전류가 둘을 지나므로 저항이 LED의 전류를 제한해요.</p><p>저항을 빼면 과도한 전류로 LED가 손상될 수 있어요. 이 도안의 저항은 <strong>읽기 경로</strong>에 있어요. 충전 전류까지 제한하지는 않아요.</p><p>기억을 저장하는 부품은 <strong>축전기</strong>예요.</p></aside></div></div>' +
      '<p class="ramc-model-note">이 모식도는 각 단계의 <strong>고정 장면</strong>이에요. 실제 전류의 크기나 불이 켜지는 시간을 계산한 시뮬레이션은 아니에요. 쓰기와 읽기를 함께 누르면 전지가 LED에 에너지를 공급할 수 있어, 저장했던 에너지인지 구분하기 어려워요.</p>' +
      '<div class="ramc-part-picker"><h3>모식도에서 위치 찾기</h3><p>부품을 골라 위 회로도에서 위치와 역할을 연결해 봐요. 선택한 부품은 주황색으로 표시돼요.</p><div class="ramc-parts" role="group" aria-label="모식도 부품 선택">' + Object.keys(parts).map(function (key) { return '<button type="button" data-ramc-part="' + key + '" aria-pressed="false">' + parts[key][0] + '</button>'; }).join('') + '</div><div class="ramc-part-copy" aria-live="polite" aria-atomic="true"><strong data-ramc-part-title>부품을 선택해 보세요.</strong><p data-ramc-part-text>축전기에서 시작해 쓰기 길과 읽기 길을 각각 짚어 보세요.</p></div></div>' +
      '<details class="ramc-question"><summary>확인해 보기 · 두 스위치를 놓았더니 LED가 꺼졌어요. 기억도 사라졌을까요?</summary><p><strong>그렇게 판단할 수 없어요.</strong> 읽기 스위치가 열려 있어 LED에 전류가 흐르지 않는 상태일 수 있어요. 축전기에 전하가 남아 있다면, S1을 놓은 채 S2만 눌렀을 때 LED가 켜질 수 있어요. 읽는 중 꺼져도 전압이 정확히 0V라는 뜻은 아니에요.</p></details></section>';
  }
  function setScene(root, key) {
    const scene = scenes[key];
    if (!scene) return;
    root.dataset.ramcScene = key;
    root.querySelectorAll('[data-ramc-stage]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.ramcStage === key)); });
    ['title', 'text', 'path', 'detail'].forEach(function (name) { root.querySelector('[data-ramc-' + name + ']').textContent = scene[name]; });
    root.querySelectorAll('[data-ramc-switch-label]').forEach(function (t) { t.textContent = t.dataset.ramcSwitchLabel === 'write' ? scene.s1 : scene.s2; });
    root.querySelectorAll('[data-ramc-switch]').forEach(function (p) { p.setAttribute('d', ((p.dataset.ramcSwitch === 'write' && key === 'write') || (p.dataset.ramcSwitch === 'read' && key === 'read')) ? p.dataset.ramcClosed : p.dataset.ramcOpen); });
    root.querySelectorAll('[data-ramc-led-label]').forEach(function (t) { t.textContent = scene.led; });
    root.querySelectorAll('[data-ramc-charge-label]').forEach(function (t) { t.textContent = scene.charge; });
    root.querySelectorAll('.ramc-svg').forEach(function (el) { el.setAttribute('aria-label', scene.alt); });
  }
  function setPart(root, key) {
    if (!parts[key]) return;
    root.querySelectorAll('[data-ramc-part]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.ramcPart === key)); });
    root.querySelectorAll('[data-ramc-mark]').forEach(function (el) { el.classList.toggle('ramc-selected', el.dataset.ramcMark === key); });
    root.querySelector('[data-ramc-part-title]').textContent = parts[key][0];
    root.querySelector('[data-ramc-part-text]').textContent = parts[key][1];
  }
  function mount() {
    document.querySelectorAll('[data-ramc-root]').forEach(function (root) {
      setScene(root, scenes[root.dataset.ramcScene] ? root.dataset.ramcScene : 'write');
    });
  }
  document.addEventListener('click', function (event) {
    const target = event.target instanceof Element ? event.target.closest('[data-ramc-stage], [data-ramc-part]') : null;
    if (!target) return;
    const root = target.closest('[data-ramc-root]');
    if (!root) return;
    if (target.dataset.ramcStage) setScene(root, target.dataset.ramcStage);
    else setPart(root, target.dataset.ramcPart);
  });
  global.HNRRamCircuit = { render: render, mount: mount };
})(window);


</script><script>(function(){
 'use strict';

 const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const tabs=[['home','공부할 자료'],['learn','실험 익히기'],['ram','기억 회로·8421'],['welcome','방문객 안내'],['practice','짝과 연습']];

 const parts=[
 {id:'capacitor',name:'축전기',short:'전하를 담아 두는 기억 칸',job:'정보를 저장하는 핵심 부품',text:'축전기는 전하를 저장해 두는 부품이에요. 물통에 물을 담아 두듯, 쓰기 버튼을 놓아도 잠시 전하를 담아 둘 수 있어요. 같은 축전기에서는 저장된 전하가 많을수록 양단의 전압이 높아져요.',analogy:'물통에 담긴 물의 양은 전하량, 물높이는 전압에 비유할 수 있어요. 물통의 크기는 전하를 담을 수 있는 정도인 정전용량과 연결해 생각해요.',caution:'전해 축전기는 +와 − 방향이 있어요. 현장 도안의 극성과 전원 전압을 확인해 연결해요.'},
 {id:'battery',name:'전지',short:'쓰기에 필요한 에너지 공급',job:'축전기를 충전할 에너지원',text:'쓰기 버튼을 누를 때 축전기를 충전할 에너지를 공급해요. 전지는 기억을 저장하는 칸이 아니라 그 칸을 준비해 주는 전원이에요.',analogy:'물통을 채우는 물 공급원에 비유할 수 있어요. 이 비유에서 전기에너지를 공급하는 부품이 전지예요.',caution:'정해진 전지와 홀더를 사용하고 +와 −를 바로 연결하지 않아요. 뜨거워지면 손대지 말고 교사를 불러요.'},
 {id:'write',name:'S1 · 쓰기 버튼',short:'전지 → 축전기 길 열기',job:'저장 상태를 만드는 스위치',text:'누르면 전지와 축전기 사이의 충전 경로가 이어져요. 손을 떼면 그 경로가 끊어져요. 먼저 쓰기 버튼만 눌러 충전한 뒤, 두 버튼에서 모두 손을 떼어요.',analogy:'물통에 물을 넣는 쪽의 밸브예요. 우리 실물 모형에서는 주로 충전해 높은 전압 상태를 만드는 동작을 관찰해요.',caution:'쓰기와 읽기를 동시에 눌러 불을 켜면, 저장한 것을 읽은 것인지 구분하기 어려워요.'},

 {id:'resistor',name:'읽기 저항',short:'LED에 흐르는 전류 제한',job:'읽기 경로의 전류를 조절하는 부품',text:'읽기 버튼을 눌렀을 때 LED에 너무 큰 전류가 흐르지 않도록 제한해요. 저항과 축전기 등 회로 조건에 따라 빛의 밝기와 줄어드는 모습이 달라져요.',analogy:'물을 내보내는 관의 좁은 구간에 비유해요. 통로를 지나가는 흐름을 제한하는 역할이지, 기억을 담는 역할은 아니에요.',caution:'LED와 이어진 저항을 빼거나 임의로 다른 값으로 바꾸지 않아요. 현장에 준비된 도안의 값을 따라요.'},

 {id:'wire',name:'전선·구리테이프',short:'각 부품 사이의 길 연결',job:'전류가 흐를 연결 경로',text:'전지, 버튼, 축전기, 저항, LED를 도안대로 이어 줘요. 도안에서 만나야 하는 곳은 잘 닿고, 떨어져 있어야 하는 곳은 서로 닿지 않아야 해요.',analogy:'물통·밸브·물레방아를 잇는 관처럼 생각해요. 단, 실제 회로에서는 전류가 이어진 경로를 따라 흘러요.',caution:'테이프가 겹쳐도 접착면 때문에 잘 연결되지 않을 수 있어요. 작동하지 않으면 임의로 누르기보다 진행자와 접촉을 확인해요.'},

function memory8421(){return section('[최종 면접] 4비트 이진수 연산 테스트',`<div class="notice"><strong>감독관의 비밀 숫자를 네 회로로 표현하자!</strong><p>미션판의 자리 값: [ 8 ] [ 4 ] [ 2 ] [ 1 ]. 불이 켜지면(1) 그 숫자를 더하고, 꺼지면(0) 더하지 않아요.</p></div><ol class="memory-steps"><li><b>준비</b> 회로를 서로 연결하지 않고 나란히 놓아요. S1은 놓고 S2를 충분히 눌러 먼저 비웁니다.</li><li><b>비밀 숫자가 11이라면</b> 8·2·1 자리의 S1만 눌러 충전해요. 4 자리는 비워 둡니다. 모든 버튼에서 손을 뗍니다.</li><li><b>읽고 확인</b> 곧바로 S2만 하나씩 누릅니다. 켜지는 순간의 신호가 [1][0][1][1]이면 8+2+1=11, 미션 성공!</li><li><b>교대</b> 회로를 비우고 역할을 바꿔요. 0~15의 새로운 비밀 숫자에 도전해요.</li></ol><div class="bit-practice"><h3>신호창으로 연습하기</h3><p>아래는 숫자 표현을 확인하는 개념 그림이에요. 실물 LED는 S2를 눌러 읽는 순간 확인하세요.</p><div class="bits8421" role="group" aria-label="8 4 2 1 신호창">${[8,4,2,1].map((n,i)=>`<button type="button" data-bit8421="${n}" aria-label="${n} 자리의 신호 바꾸기" aria-pressed="${i!==1}"><span>${n} 미션판</span><b>${i!==1?'1':'0'}</b></button>`).join('')}</div><p id="sum8421" class="sum8421" aria-live="polite">8 + 2 + 1 = 11</p></div><p>읽을 때 저장한 에너지를 사용하므로 LED가 켜지는 순간을 관찰해요. 다음 시험 전에는 회로를 비우고 다시 저장해요.</p><div class="actions">${openLink('resources/8421-final-interview.pdf','최종 면접 활동지 PDF','button secondary')}${openLink('resources/8421-mats.pdf','8421 미션판 A4 네 장')}</div>`);}
function update8421(){const chosen=[];document.querySelectorAll('[data-bit8421]').forEach(b=>{const on=b.getAttribute('aria-pressed')==='true';b.querySelector('b').textContent=on?'1':'0';if(on)chosen.push(Number(b.dataset.bit8421));});document.getElementById('sum8421').textContent=(chosen.length?chosen.join(' + '):'0')+' = '+chosen.reduce((a,b)=>a+b,0);}

 function ram(){return `<div class="wrap"><header class="ram-lede"><div><span class="eyebrow">ONE BIT, ONE MEMORY CELL</span><h1>메모리 반도체 체험<br>DRAM 1비트 만들기</h1><p class="lead"><strong>전기를 잠시 담아 두었다가 읽어 보는,<br>‘1비트 DRAM 원리 모형’</strong>이에요.<br>컴퓨터 속 아주 작은 기억 칸의 원리를 손으로 만질 수 있는 큰 부품으로 만들어 봐요.</p><div class="actions">${openLink('../explain/dram.html','만들기 전 함께 볼 설명 HTML','button')}${openLink('resources/ram-manual.pdf','회로 제작 매뉴얼 PDF','button secondary')}</div></div><div class="bit-tile"><div class="bits">0 / 1</div><b>한 칸에 둘 중 하나.</b><p>1비트는 0 또는 1 한 가지를 나타내는<br>정보의 작은 단위예요.<br>한 칸만으로 사진이나 문장을 담지는 못해요.</p></div></header>
 ${section('컴퓨터의 RAM은 ‘작업 책상’ 같아요.',`<div class="grid"><article class="analogy-card"><span class="step-num">CPU · 작업하는 사람</span><span class="bigword">생각하고 계산해요.</span><p>계산하고 명령을 처리하는 역할이에요. 책상에 꺼내 놓은 자료를 사용해 일을 한다고 생각해 봐요.</p></article><article class="analogy-card"><span class="step-num">RAM · 작업 책상</span><span class="bigword">지금 쓸 것을 펼쳐요.</span><p>실행 중인 프로그램과 지금 필요한 데이터를 빠르게 꺼내 쓰는 작업 공간이에요. 일반적인 DRAM은 전원이 끊기면 내용을 유지하지 못해요.</p></article><article class="analogy-card"><span class="step-num">SSD · 자료를 보관하는 책장</span><span class="bigword">나중에도 꺼내 봐요.</span><p>프로그램과 저장한 파일을 오래 보관해요. 전원을 꺼도 남겨 둘 자료는 이런 저장장치에 저장해요.</p></article></div><div class="notice"><strong>우리 작품은 그 책상 전체가 아니라, 아주 작은 ‘기억 한 칸’의 원리예요.</strong><p>RAM은 메모리의 이름이고, DRAM은 그중 축전기에 전하를 저장하는 방식이에요. 실제 DRAM에는 이런 기억 칸이 매우 많이 모여 있어요. 모든 종류의 RAM이 축전기를 사용하는 것은 아니에요.</p></div>`)}
 ${window.HNRRamCircuit.render()}
 ${memory8421()}

 ${section('물통으로 ‘쓰기 → 저장 → 읽기’ 이해하기',`<div class="memory-demo"><div class="memory-visual"><div><div class="tank" aria-label="축전기에 남은 전하를 물높이로 비유"><div class="water" id="memoryWater"></div><span class="tank-caption">축전기 = 물통</span></div></div><div><p class="demo-caption">같은 물통에서<br>물높이 ↔ 전압</p><div class="led-line"><span class="led" id="memoryLed"></span><span id="ledLabel">LED 꺼짐</span></div></div></div><div><span class="eyebrow">버튼을 순서대로 눌러 보세요</span><h3 id="memoryHeading">손을 떼면, 빛과 기억은 어떻게 될까요?</h3><p id="memoryText" aria-live="polite">① 쓰기로 채운 다음 ② 두 버튼을 놓아 보세요. LED가 꺼져도 축전기에 전하가 남아 있을 수 있다는 점을 확인해요.</p><div class="segments" role="group" aria-label="메모리 동작"><button data-memory="write" aria-pressed="false">① 쓰기</button><button data-memory="hold" aria-pressed="false">② 손 떼고 저장</button><button data-memory="read" aria-pressed="false">③ 읽기</button></div><button class="quiet" data-memory="reset">처음으로</button></div></div><p class="note" style="margin-top:16px">동작을 이해하는 비유이며 실제 충전 시간·전압·밝기의 측정값은 아니에요. 물통은 전하를 완전히 가둬 두는 장치처럼 보이지만, 실제 축전기에는 누설이 있어 시간이 지나면 저장 상태가 약해질 수 있어요.</p><div class="notice"><strong>LED가 꺼졌다고 곧바로 ‘0’이라고 말하지 않아요.</strong><p>읽기 버튼을 놓아 길이 끊겨 있을 수도 있고, LED를 켤 만큼 전압이 높지 않을 수도 있어요. 0·1은 정해 둔 기준으로 구분하는 상태예요. 실제 DRAM은 작은 전압 차이를 감지 회로로 읽어요.</p></div>`)}
 ${section('반도체 속 DRAM과 어디가 닮았나요?',`<div class="table-wrap" tabindex="0" role="region" aria-label="우리 모형과 실제 DRAM 비교 표, 좁은 화면에서는 옆으로 스크롤"><table class="compare-table"><thead><tr><th>역할</th><th>우리가 만드는 모형</th><th>실제 DRAM</th></tr></thead><tbody><tr><td><strong>저장</strong></td><td>큰 축전기에 전하를 담아요.</td><td>아주 작은 축전기에 전하를 저장해요.</td></tr><tr><td><strong>연결 제어</strong></td><td>두 버튼으로 쓰기·읽기 경로를 나눠 조작해요.</td><td>보통 셀 하나에 트랜지스터 1개가 있어요. 전기 신호로 켜고 끄는 스위치예요.</td></tr><tr><td><strong>읽기</strong></td><td>저장한 에너지로 LED를 켜요. 읽는 동안 전하가 줄어요.</td><td>셀 밖 감지 회로가 미세한 차이를 구별해 0·1을 읽고, 읽은 상태를 다시 복원해요.</td></tr><tr><td><strong>오래 유지</strong></td><td>자동 복원 장치가 없어요. 충전한 뒤 읽기와 방전을 관찰해요.</td><td>누설로 약해지는 정보를 주기적으로 다시 유지해요. 이것이 리프레시예요.</td></tr><tr><td><strong>크기·구조</strong></td><td>손으로 만질 수 있는 부품을 연결한 교육 모형이에요.</td><td>반도체 칩 안에 많은 셀과 선택·감지·제어 회로가 함께 있어요.</td></tr></tbody></table></div><div class="grid two" style="margin-top:22px"><div class="panel pale"><span class="step-num">1T1C</span><h3>트랜지스터 1개 + 축전기 1개</h3><p>일반적인 DRAM 셀의 기본 구성이에요. <strong>우리 모형의 버튼 두 개와 LED</strong>가 실제 셀에 그대로 들어가지는 않아요. LED는 읽는 모습을 보여 주려고 붙인 부품이에요.</p></div><div class="panel pale"><span class="step-num">REFRESH</span><h3>원래 기억을 다시 살려 줘요.</h3><p>리프레시는 모든 칸을 꽉 채워 1로 만드는 일이 아니에요. 원래 0이던 칸은 0으로, 1이던 칸은 1로 유지하도록 해요. 우리 모형에는 이 자동 기능이 없어요.</p></div></div><div class="notice"><strong>“반도체 칩을 만들었어요”보다 이렇게 말해요.</strong><p>“반도체 메모리 안의 <b>기억 한 칸이 작동하는 원리</b>를 큰 부품으로 만들었어요. 축전기에 전하를 저장하고 읽는 점이 실제 DRAM과 닮았어요.”</p></div>`)}
 ${section('만들면서 다시 확인해요.',`<div class="grid"><article class="panel"><h3>사진으로 따라 만들기</h3><p>실제 부품 사진으로 보는 12단계 매뉴얼. A4 세로 양면 한 장이에요.</p>${openLink('resources/ram-manual-photo.pdf','사진 매뉴얼 PDF')}</article><article class="panel"><h3>기호로 연결 확인하기</h3><p>극성과 연결 위치를 또렷한 모식도로 확인해요. 사진판과 같은 순서예요.</p>${openLink('resources/ram-manual-symbols.pdf','기호 매뉴얼 PDF')}</article><article class="panel"><h3>실물 크기 도안</h3><p>구리테이프를 붙일 도안이에요. A4에 실제 크기 100%로 인쇄하면 길의 폭이 1cm예요.</p>${openLink('resources/ram-template.pdf','회로 도안 PDF')}</article></div>`)}
 ${section('방문객에게 한 번에 설명해 보기',audienceBlock(stations.find(s=>s.id==='dram')))}
 ${section('작품을 건네기 전, 마지막 확인',`<div class="grid two"><div class="panel"><h3>작동을 확인해요.</h3><ol><li>전원 연결 전, 도안과 극성·접촉을 확인해요.</li><li><strong>쓰기만 → 두 버튼 모두 놓기 → 읽기만</strong> 순서로 확인해요.</li><li>반응이 없으면 LED·축전기 방향과 접촉을 교사와 점검해요. 두 버튼을 동시에 눌러 통과시키지 않아요.</li></ol></div><div class="panel"><h3>설명을 듣고 가져가요.</h3><ol><li>본 체험의 원리와 기억 회로 사용법을 확인해요. 코일 열차·브레이크의 자유 체험 완료를 요구하지 않아요.</li><li>전지·부품이 잘 고정됐는지, 뜨거움·손상이 없는지 확인해요.</li><li>버튼을 놓아 보관하고 금속 물건으로 전지 양극을 잇지 않도록 알려 줘요. 분리 가능한 전지는 교사 안내대로 보관해요.</li><li>작은 부품을 입에 넣거나 어린 동생에게 주지 않도록 안내한 뒤 작품을 건네요.</li></ol></div></div><div class="actions"><a class="button" href="#practice">짝에게 설명해 보기</a>${openLink('../explain/dram.html','현장 RAM 설명 화면','button secondary')}</div>`)}
 <details class="section"><summary>원리를 더 확인할 자료</summary><p class="source-list">${openLink('https://semiconductor.samsung.com/kr/dram/','삼성전자 DRAM 소개')}${openLink('https://ocw.mit.edu/courses/6-004-computation-structures-spring-2017/pages/c5/c5s1/','MIT 메모리 강의 자료')}</p></details></div>`;}
 function welcome(){return `<div class="wrap"><div class="page-intro"><span class="eyebrow">BOOTH OPERATION</span><h1>책상 배치와 방문객 안내</h1><p class="lead">책상은 3개, 각각 180×75cm이에요.<br>테스트 구역은 제작 책상 안에 마련해요.</p></div>
${section('책상별 담당',`<div class="table-plans"><article class="table-plan"><h3>책상 1 · 접수와 자유 체험</h3><div class="table-zones"><div><b>접수 쪽 절반</b><p>본 체험 안내<br>실험 책상으로 출발 안내</p></div><div><b>전자기 체험 쪽 절반</b><p>코일 열차<br>전자기 브레이크</p></div></div><p>학생 연구원이 실험 책상까지 안내해요. 이동 통로와 대기 위치를 확인하세요.</p></article><article class="table-plan"><h3>책상 2 · 제작과 테스트</h3><div class="table-zones"><div><b>제작 ZONE</b><p>1비트 기억 회로 만들기<br>전원 연결 전 검사</p></div><div><b>테스트 ZONE</b><p>S1·S2 작동 확인<br>네 회로로 비밀 숫자 완성하기</p></div></div><p>회로 네 개를 나란히 놓을 자리를 확보해요. 작업량에 맞춰 두 구역의 비율을 조절하세요.</p></article><article class="table-plan"><h3>책상 3 · 본 체험과 디지털 기기</h3><div class="table-zones"><div><b>전기 실험</b><p>에너지스틱 · 정전기 캔<br>플라즈마볼</p></div><div><b>기기 사용</b><p>맵 접속과 캐릭터 조작<br>원리 HTML 함께 보기</p></div></div><p>기기는 책상 위에서 사용해요. 유리관·실험 장치와 부딪치지 않도록 놓고 바닥 전선을 정리하세요.</p></article></div><p class="note">위 그림은 기능 배치도이에요. 천막 크기는 확인되지 않았으므로 책상 방향과 통로 폭은 현장에서 정해요.</p>`)}

${section('처음 안내할 말',`<div class="panel pale"><p class="script">“본 체험은 전기 실험을 한 뒤 기억 회로를 만들고, 네 회로로 숫자를 저장하는 순서이에요. 활동 중에는 준비된 기기로 맵을 조작해요. 현장 이동 순서는 학생 연구원의 안내를 따라 주세요!”</p></div><div class="panel" style="margin-top:16px"><h3>예약 없이 들른 관람객에게</h3><p class="script">“여기서는 예약 없이 코일 열차와 전자기 브레이크를 체험할 수 있어요. 자석은 제가 안내한 뒤 함께 다뤄 주세요.”</p></div>`)}
${section('진행 순서를 맞추세요',`<div class="grid two"><div class="panel"><h3>정전기 캔</h3><p>같은 조건 준비 → 빨대별 최초 이동 거리 측정 → 순서를 바꿔 반복 → 결과와 원리 설명.</p></div><div class="panel"><h3>전자기 브레이크</h3><p>닫힌 관 관찰 → 원리 HTML 설명 → 절개 관 예상 → 실제 비교. 자유 체험에서는 말로 예상해요.</p></div><div class="panel"><h3>코일 열차</h3><p>안전 안내 → 작동 관찰 → 짧은 원리 설명 → 장치 회수. 추가 비교 질문은 넣지 않아요.</p></div><div class="panel"><h3>제작과 테스트</h3><p>회로 검사 → 1비트 작동 확인 → 8421 준비·저장·읽기 → 역할 교환. 회로끼리 배선을 잇지 않아요.</p></div></div>`)}
${section('기다림·장치 이상·마무리',`<div class="details-list"><details><summary>기다리는 사람이 많을 때</summary><p>본 체험 대기와 자유 체험 관람 위치를 구분해 안내하세요. 학생 인원이 부족하면 자유 체험을 잠시 멈추고 교사에게 도움을 요청해요.</p></details><details><summary>장치가 뜨겁거나 손상됐을 때</summary><p>작동을 멈추고 주변 손을 치우게 해요. 뜨거운 부품이나 깨진 유리는 학생이 직접 처리하지 않고 교사를 부릅니다.</p></details><details><summary>모르는 질문을 받았을 때</summary><p>“그 부분은 확인하고 말씀드리겠습니다. 선생님께 함께 여쭤보겠습니다.” 관찰한 사실과 아직 모르는 이유를 구분하고 결과를 지어내지 않아요.</p></details><details><summary>포토부스 안내</summary><p>준비된 기기로 촬영한 뒤 화면에 표시되는 QR을 휴대전화로 스캔해 사진을 내려받도록 안내해요. 저장 여부를 확인한 뒤 다음 참가자에게 자리를 내어 줍니다.</p></details></div><div class="actions">${openLink('resources/operations.pdf','운영가이드·점검표 PDF','button')}${openLink('resources/notices.pdf','현장 안내 표찰','button secondary')}</div>`)}
</div>`;}

 function practice(){return `<div class="wrap"><div class="page-intro"><span class="eyebrow">PAIR PRACTICE</span><h1>짝과 운영 연습</h1><p class="lead">A는 방문객, B는 학생 연구원을 맡습니다.<br>한 번 진행한 뒤 역할을 바꾸세요.</p></div>
${section('다섯 단계로 연습',`<ol class="practice-list">${DATA.pairedPractice.map(x=>`<li><div><h3>${esc(x.title)}</h3><p>${esc(x.action)}</p></div></li>`).join('')}</ol>`)}

${section('상황별 대응 연습',`<div class="practice-prompt"><span class="step-num" id="scenarioCount">상황 ${scenarioIndex+1} / ${scenarios.length}</span><h3 id="scenarioTitle">${scenarios[scenarioIndex][0]}</h3><p id="scenarioText">${scenarios[scenarioIndex][1]}</p><button class="button secondary" id="nextScenario">다음 상황</button></div><p class="note">위험한 상황을 실제로 만들지 말고 말로 대응을 연습하세요.</p>`)}

<section class="section"><div class="section-head"><div><h2>설명 녹음 연습</h2><p>원하면 설명을 녹음해 듣고 어려운 표현과 빠진 안내를 확인하세요.</p></div></div><div id="voiceTool"></div></section>
<details class="section"><summary>약 3시간 교육 운영 예시</summary><div class="timer-row">${[['15분','책상 배치·본 체험과 자유 체험 구분'],['35분','장치별 원리·안전'],['40분','정전기·브레이크 진행 순서 연습'],['10분','휴식·장치 정리'],['30분','1비트 제작·8421 저장과 읽기'],['40분','역할 교환·방문객 응대'],['10분','전체 동선·마감 점검']].map(([t,s])=>`<div class="timing"><b>${t}</b>${s}</div>`).join('')}</div><p>시간은 교사의 현장 안내에 맞춰 조절해요.</p></details></div>`;}
 function memory(action){clearInterval(memoryTimer);memoryTimer=null;memoryMode=action;if(action==='reset'){charge=0;memoryMode='ready';}if(action==='write')charge=85;
 const text={ready:['손을 떼면, 빛과 기억은 어떻게 될까요?','① 쓰기로 채운 다음 ② 두 버튼을 놓아 보세요. LED가 꺼져도 축전기에 전하가 남아 있을 수 있다는 점을 확인해요.'],write:['쓰기 · 전지에서 축전기로','쓰기 경로가 이어져 축전기가 충전돼요. 읽기 버튼은 놓고 있으므로 LED는 꺼져 있어요.'],hold:['저장 · 두 버튼에서 손 떼기',charge>0?'쓰기와 읽기 경로가 모두 끊겼어요. LED는 꺼져 있지만 축전기에는 전하가 남아 있어요. 실제 부품은 누설 때문에 시간이 지나면 전하가 줄 수 있어요.':'아직 충전하지 않았어요. 쓰기를 눌러 축전기를 채운 다음 두 버튼을 놓은 상태를 살펴보세요.'],read:['읽기 · 저장한 에너지로 확인',charge>20?'전지는 쓰기 경로에서 끊겨 있어요. 축전기에 남은 에너지로 LED가 켜지고, 읽는 동안 전하가 줄어요. 시간이 지나면 빛이 약해져요.':'현재 모형의 전압은 LED를 켜기에 충분하지 않아요. 빛이 없다는 사실만으로 전하가 정확히 0이라고 판단하지 않아요.']};
 $('#memoryHeading').textContent=text[memoryMode][0];$('#memoryText').textContent=text[memoryMode][1];document.querySelectorAll('[data-memory]').forEach(b=>{if(b.hasAttribute('aria-pressed'))b.setAttribute('aria-pressed',b.dataset.memory===memoryMode)});drawMemory();if(action==='read'&&charge>8){memoryTimer=setInterval(()=>{charge=Math.max(8,charge-2);drawMemory();if(charge<=8){clearInterval(memoryTimer);memoryTimer=null;$('#memoryText').textContent='읽는 동안 전하가 줄어 LED가 꺼졌어요. 실제 DRAM은 읽은 0·1을 복원하지만, 우리 모형은 자동 복원하지 않아요. 다시 쓰기로 충전해 볼 수 있어요.'}},120);}}
 function drawMemory(){if(!$('#memoryWater'))return;$('#memoryWater').style.height=charge+'%';const lit=memoryMode==='read'&&charge>20;$('#memoryLed').classList.toggle('on',lit);$('#ledLabel').textContent=lit?'LED 켜짐':'LED 꺼짐';}
 function render(){let hash=location.hash.slice(1)||'home';if(hash==='main'){history.replaceState(null,'',location.pathname+location.search+'#'+(currentRoute||'home'));$('#main').focus();return}let [route,id]=hash.split('/');if(!tabs.some(t=>t[0]===route)){route='home';history.replaceState(null,'',location.pathname+location.search+'#home')}currentRoute=route+(id?'/'+id:'');clearInterval(memoryTimer);memoryTimer=null;window.HNRVoice?.unmount();$('#navLinks').innerHTML=tabs.map(([k,t])=>`<a href="#${k}" ${k===route?'aria-current="page"':''}>${t}</a>`).join('');$('#main').innerHTML=route==='home'?home():route==='learn'?learn(id):route==='ram'?ram():route==='welcome'?welcome():practice();document.title=route==='home'?'HNR TECH 학생 운영교육':`HNR Tech Inc. | ${tabs.find(t=>t[0]===route)[1]}`;if(route==='ram'){charge=0;memoryMode='ready';drawMemory();window.HNRRamCircuit.mount()}if(route==='practice')window.HNRVoice?.mount($('#voiceTool'));window.scrollTo({top:0,behavior:'instant'});}
 document.addEventListener('click',e=>{const bit=e.target.closest('[data-bit8421]');if(bit){bit.setAttribute('aria-pressed',bit.getAttribute('aria-pressed')!=='true');update8421();}const audienceBtn=e.target.closest('[data-audience]');if(audienceBtn){audience=audienceBtn.dataset.audience;const area=audienceBtn.closest('.audience'),s=stations.find(s=>s.id===area.dataset.station);area.querySelectorAll('[data-audience]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.audience===audience));area.querySelector('.audience-output').textContent='“'+s.audience[audience]+'”';}
 const partBtn=e.target.closest('[data-part]');if(partBtn){part=partBtn.dataset.part;document.querySelectorAll('[data-part]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.part===part));$('#partDetail').innerHTML=partDetail(parts.find(p=>p.id===part));}

 if(e.target.closest('.skip')){e.preventDefault();$('#main').focus();$('#main').scrollIntoView({block:'start'});}
 });
