<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>상 · 구리관 속 느려지는 자석 · HNR Tech Inc. · 오프라인</title><style>/* ═══════════════════════════════════════════════════════════════
   core.css — 소비 전력 강의 덱 공통 (Apple DESIGN.md 언어)
   무대 1920×1080 · 면 색이 구획 · 액션 블루 하나 · UI 그림자 없음
   ═══════════════════════════════════════════════════════════════ */
:root{
  /* 면 */
  --c-white:#ffffff; --c-parchment:#f5f5f7; --c-black:#000000; --c-dark:#1d1d1f; --c-graphite:#272729;
  /* 글자 */
  --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#86868b; --on-dark:#f5f5f7; --on-dark-2:#a1a1a6; --on-dark-3:#6e6e73;
  --hair:#e0e0e0; --hair-dark:#3a3a3c;
  /* 행동 */
  --action:#0066cc; --action-dark:#2997ff;
  /* 에너지 — 어두운 면 기본값(밝은 면에서 아래 .slide[data-tile] 규칙이 덮어씀) */
  --elec:#64D2FF; --light:#FFD60A; --heat:#FF6A3D; --sound:#BF5AF2; --kin:#30D158;
  /* 에너지 — 면과 무관하게 고정된 두 벌(그림 속에서 직접 고를 때) */
  --elec-hi:#64D2FF; --light-hi:#FFD60A; --heat-hi:#FF6A3D; --sound-hi:#BF5AF2; --kin-hi:#30D158;
  --elec-lo:#0077B6; --light-lo:#9A7400; --heat-lo:#C4391B; --sound-lo:#8A3FC0; --kin-lo:#1E8B3E;
  /* 글꼴 */
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  /* 움직임 */
  --ease-out:cubic-bezier(.2,.8,.2,1); --ease-inout:cubic-bezier(.65,0,.35,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  word-break:keep-all;overflow-wrap:break-word;-webkit-user-select:none;user-select:none;font-feature-settings:"ss03"}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ── 무대 ── */
#viewport{position:fixed;inset:0;overflow:hidden;background:#000}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#000;contain:layout paint}
.slide{position:absolute;inset:0;display:none;overflow:hidden;isolation:isolate}
.slide.is-on{display:block}
.slide.is-out{display:block;z-index:1}
.slide.is-on{z-index:2}

/* ── 면(타일) ── 다크: 에너지가 빛나는 무대 / 라이트: 정의와 타이포 */
.slide[data-tile="black"]{background:var(--c-black);color:var(--on-dark)}
.slide[data-tile="dark"]{background:var(--c-dark);color:var(--on-dark)}
.slide[data-tile="graphite"]{background:var(--c-graphite);color:var(--on-dark)}
.slide[data-tile="light"]{background:var(--c-white);color:var(--ink)}
.slide[data-tile="parchment"]{background:var(--c-parchment);color:var(--ink)}
.slide[data-tile="light"],.slide[data-tile="parchment"]{
  --elec:var(--elec-lo); --light:var(--light-lo); --heat:var(--heat-lo); --sound:var(--sound-lo); --kin:var(--kin-lo);
  --t2:var(--ink-2); --t3:var(--ink-3); --hl:var(--hair); --act:var(--action);
}
.slide[data-tile="black"],.slide[data-tile="dark"],.slide[data-tile="graphite"]{
  --t2:var(--on-dark-2); --t3:var(--on-dark-3); --hl:var(--hair-dark); --act:var(--action-dark);
}

/* ── 글자 체계 (무대 px) — 최소 24px ── */
.t-hero{font-size:168px;font-weight:600;line-height:1.02;letter-spacing:-.035em}
.t-display{font-size:120px;font-weight:600;line-height:1.05;letter-spacing:-.03em}
.t-title{font-size:84px;font-weight:600;line-height:1.1;letter-spacing:-.025em}
.t-head{font-size:60px;font-weight:600;line-height:1.14;letter-spacing:-.022em}
.t-lead{font-size:44px;font-weight:400;line-height:1.3;letter-spacing:-.012em}
.t-airy{font-size:40px;font-weight:300;line-height:1.4;letter-spacing:-.005em}
.t-label{font-size:34px;font-weight:600;line-height:1.2;letter-spacing:-.01em}
.t-body{font-size:32px;font-weight:400;line-height:1.47;letter-spacing:-.01em}
.t-cap{font-size:26px;font-weight:400;line-height:1.35;letter-spacing:-.005em}
.t-eyebrow{font-size:30px;font-weight:600;line-height:1.2;letter-spacing:.01em;color:var(--t2)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum","ss03";letter-spacing:-.02em}
.mute{color:var(--t2)} .mute2{color:var(--t3)}
.c-elec{color:var(--elec)} .c-light{color:var(--light)} .c-heat{color:var(--heat)} .c-sound{color:var(--sound)} .c-kin{color:var(--kin)}
.unit{font-weight:400;letter-spacing:0;margin-left:.12em}
.center{text-align:center}

/* 배치 도우미 — 슬라이드 조각이 자유롭게 쓴다 */
.abs{position:absolute}
.fill{position:absolute;inset:0}
.full-svg{position:absolute;inset:0;width:1920px;height:1080px;overflow:visible}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.pill{display:inline-flex;align-items:center;gap:12px;border-radius:9999px;padding:12px 26px;font-size:28px;font-weight:600}
.pill.ghost{border:2px solid currentColor}
.chip-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:9999px;padding:16px 34px;font-size:30px;font-weight:600;
  background:var(--act);color:#fff;transition:transform .15s var(--ease-out)}
.chip-btn:active{transform:scale(.95)}
.card{border-radius:18px;border:1px solid var(--hl);padding:32px}
svg text{font-family:var(--font)}

/* ── 선언형 등장: data-in(들어올 때) / data-step="k"(k번째 클릭) / data-out="k" ── */
[data-in],[data-step]{opacity:0}
[data-fx="draw"],[data-fx="draw"] :is(path,line,polyline,polygon,circle,ellipse,rect){stroke-dasharray:1 1;stroke-dashoffset:1}
[data-fx="draw"]{opacity:1}
svg [data-in],svg [data-step],svg .tb{transform-box:fill-box;transform-origin:center}
.tb{transform-box:fill-box;transform-origin:center}
.tb-bl{transform-box:fill-box;transform-origin:left bottom}
.tb-b{transform-box:fill-box;transform-origin:center bottom}

/* ── HUD (Apple 원형 칩) ── */
#hud{position:fixed;right:22px;bottom:18px;display:flex;align-items:center;gap:8px;z-index:50;opacity:0;transform:translateY(8px);
  transition:opacity .35s var(--ease-out),transform .35s var(--ease-out);pointer-events:none}
#hud.show{opacity:1;transform:none;pointer-events:auto}
#hud button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(210,210,215,.64);color:#1d1d1f;
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);transition:transform .15s var(--ease-out)}
#hud button:active{transform:scale(.92)}
#hud button svg{width:20px;height:20px}
#hud .count{min-width:84px;height:44px;border-radius:9999px;display:grid;place-items:center;padding:0 16px;background:rgba(210,210,215,.64);color:#1d1d1f;
  font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
#progress{position:fixed;left:0;right:0;bottom:0;height:3px;z-index:40;background:transparent}
#progress i{display:block;height:100%;width:0;background:rgba(255,255,255,.38);transition:width .5s var(--ease-out),background .4s}
body.on-light #progress i{background:rgba(0,0,0,.22)}
#stepdots{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:9px;z-index:40;opacity:0;transition:opacity .35s}
#stepdots.show{opacity:1}
#stepdots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.28);transition:background .3s,transform .3s}
#stepdots i.on{background:rgba(255,255,255,.9);transform:scale(1.15)}
body.on-light #stepdots i{background:rgba(0,0,0,.16)} body.on-light #stepdots i.on{background:rgba(0,0,0,.62)}

/* ── 덮개(노트·전체보기·도움말) ── */
.overlay{position:fixed;inset:0;z-index:60;display:none}
.overlay.show{display:block}
#notes{position:fixed;left:0;right:0;bottom:0;height:36vh;z-index:55;transform:translateY(102%);transition:transform .45s var(--ease-out);
  background:rgba(22,22,23,.86);color:#f5f5f7;-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  padding:22px 40px 26px;overflow:auto;border-top:1px solid rgba(255,255,255,.08)}
#notes.show{transform:none}
#notes .nh{display:flex;align-items:baseline;gap:14px;margin-bottom:10px;font-size:15px;color:#a1a1a6;font-weight:600;letter-spacing:.01em}
#notes .nh b{color:#f5f5f7;font-size:18px}
#notes .nh .nx{margin-left:auto;font-weight:400}
#notes p{font-size:clamp(17px,1.55vw,24px);line-height:1.6;margin:0 0 .7em;color:#e8e8ed;max-width:1500px}
#notes p .pn{display:inline-block;font-size:.66em;font-weight:700;color:#2997ff;margin-right:.6em;vertical-align:.12em}
#notes p b{color:#fff;font-weight:700}
#notes p .cue{display:inline-block;margin-top:.3em;padding:2px 12px;border-radius:9999px;background:rgba(41,151,255,.18);color:#8cc8ff;font-size:.85em}

#overview{background:rgba(0,0,0,.72);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);overflow:auto;padding:56px 5vw}
#overview h2{color:#f5f5f7;font-size:28px;font-weight:600;letter-spacing:-.01em;margin-bottom:22px}
#overview .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
#overview .ov{position:relative;aspect-ratio:16/9;border-radius:11px;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;
  border:1px solid rgba(255,255,255,.1);transition:transform .2s var(--ease-out)}
#overview .ov:active{transform:scale(.97)}
#overview .ov.cur{outline:3px solid #2997ff;outline-offset:3px}
#overview .ov .n{font-size:14px;font-weight:700;opacity:.6;font-variant-numeric:tabular-nums}
#overview .ov .tt{font-size:19px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
#overview .ov[data-tile="black"],#overview .ov[data-tile="dark"],#overview .ov[data-tile="graphite"]{background:#1d1d1f;color:#f5f5f7}
#overview .ov[data-tile="light"]{background:#fff;color:#1d1d1f}
#overview .ov[data-tile="parchment"]{background:#f5f5f7;color:#1d1d1f}

#help{background:rgba(0,0,0,.6);display:none;place-items:center}
#help.show{display:grid}
#help .box{background:#fff;color:#1d1d1f;border-radius:18px;padding:34px 40px;min-width:520px}
#help h3{font-size:24px;font-weight:600;margin-bottom:16px;letter-spacing:-.01em}
#help table{border-collapse:collapse;font-size:17px}
#help td{padding:7px 18px 7px 0;border-bottom:1px solid #f0f0f0}
#help kbd{display:inline-block;min-width:30px;padding:3px 9px;border-radius:8px;background:#f5f5f7;border:1px solid #e0e0e0;font:600 15px var(--font);text-align:center}
#blank{position:fixed;inset:0;z-index:70;display:none}
#blank.black{display:block;background:#000} #blank.white{display:block;background:#fff}

/* 정지 화면(검증 스크린샷) — 크롬 UI 숨김 */
html.still #hud,html.still #progress,html.still #stepdots{display:none!important}
html.still *{cursor:none!important}
/* 격자 보기(?grid=1) */
#gridov{position:absolute;inset:0;z-index:30;pointer-events:none;display:none;
  background-image:linear-gradient(rgba(255,0,80,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(255,0,80,.25) 1px,transparent 1px);
  background-size:120px 120px}
html.grid #gridov{display:block}
html.grid #gridov::after{content:"";position:absolute;inset:80px 120px;border:2px dashed rgba(255,0,80,.6)}

@media (prefers-reduced-motion: reduce){ .slide *{scroll-behavior:auto} }

/* ── 소리 단추·알림 ── */
#hud button.off{opacity:.55}
#sfxToast{position:fixed;left:50%;bottom:78px;transform:translate(-50%,8px);z-index:80;padding:10px 22px;border-radius:9999px;background:rgba(29,29,31,.86);color:#f5f5f7;
  font-size:16px;font-weight:600;letter-spacing:-.01em;opacity:0;pointer-events:none;transition:opacity .25s var(--ease-out),transform .25s var(--ease-out);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
#sfxToast.show{opacity:1;transform:translate(-50%,0)}
html.still #sfxToast{display:none}

/* ── 학생 모드(?s=1): 대본 숨김 ── */
html.student #notes{display:none!important}

/* ── 장면 머리(제목) ── */
.hd{position:absolute;left:120px;top:78px;right:120px;z-index:3}
.hd .eb{font-size:28px;font-weight:600;letter-spacing:.01em;color:var(--t2);margin-bottom:10px}
.hd .eb b{color:var(--act);font-weight:700;margin-right:.35em}
.hd h2{font-size:66px;font-weight:600;line-height:1.1;letter-spacing:-.028em}
.hd h2 .soft{color:var(--t2);font-weight:400}

/* ── 개념정리 학습지 카드 · 빈칸(번호 = 학습지 빈칸 번호 ①~㉖) ── */
.ws-card{position:absolute;border-radius:18px;padding:30px 44px 26px;background:#f5f5f7;z-index:3}
.slide[data-tile="parchment"] .ws-card{background:#fff}
.slide[data-tile="black"] .ws-card,.slide[data-tile="dark"] .ws-card,.slide[data-tile="graphite"] .ws-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.ws-card .ws-h{display:flex;align-items:baseline;gap:18px;margin-bottom:6px}
.ws-card .ws-h b{font-size:40px;font-weight:700;letter-spacing:-.02em}
.ws-card .ws-h span{font-size:28px;color:var(--t2)}
.ws-row{display:grid;grid-template-columns:110px 1fr;gap:22px;align-items:baseline;font-size:38px;line-height:1.55;padding:12px 0;border-top:1px solid var(--hl)}
.ws-row:first-of-type{border-top:0}
.ws-row .tm{font-size:26px;font-weight:600;color:var(--t2);letter-spacing:.01em}
.ws-line{font-size:38px;line-height:1.6}
.bk{position:relative;display:inline-block;min-width:3.4em;margin:0 .2em;padding:0 .3em;text-align:center;line-height:1.3;white-space:nowrap;
  border-bottom:4px solid #c7c7cc}
.slide[data-tile="black"] .bk,.slide[data-tile="dark"] .bk,.slide[data-tile="graphite"] .bk{border-bottom-color:#48484a}
.bk .a{display:inline-block;font-weight:700;color:var(--act)}
.bk .n{position:absolute;left:-.62em;top:-.55em;min-width:1.25em;height:1.25em;padding:0 .2em;border-radius:9999px;background:var(--act);color:#fff;
  font-size:.6em;font-weight:700;line-height:1.25em;text-align:center;font-variant-numeric:tabular-nums}
.bk.wide{min-width:5.6em}
.qbox{position:absolute;border-radius:18px;border:1px solid var(--hl);padding:26px 34px;font-size:32px;line-height:1.5}
.qbox .qh{font-size:26px;font-weight:600;color:var(--t2);margin-bottom:6px}
.say-line{position:absolute;left:120px;right:120px;text-align:center;font-size:44px;font-weight:600;letter-spacing:-.02em;z-index:3}
.fine{position:absolute;left:120px;bottom:40px;font-size:24px;color:var(--t3);z-index:3}
/* ── 키워드 진행 표시(무대 오른쪽 위) — core.js buildKw/syncKw ── */
#kwbar{position:absolute;top:34px;right:44px;z-index:30;display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(-8px);pointer-events:none;
  transition:opacity .45s var(--ease-out),transform .45s var(--ease-out)}
#kwbar.show{opacity:1;transform:none;pointer-events:auto}
#kwbar .kw{display:flex;align-items:center;height:46px;min-width:46px;border-radius:9999px;background:rgba(0,0,0,.055);color:#86868b;
  font-size:24px;font-weight:600;letter-spacing:-.01em;line-height:1;transition:background .45s,color .45s;cursor:pointer}
#kwbar .kw b{width:46px;height:46px;flex:none;display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
#kwbar .kw span{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .6s var(--ease-out),padding .6s var(--ease-out)}
#kwbar .kw.done{background:rgba(0,0,0,.13);color:#3a3a3c}
#kwbar .kw.cur{background:var(--action);color:#fff}
#kwbar .kw.cur span{max-width:460px;padding-right:22px}
#kwbar .kw:active{transform:scale(.95)}
body:not(.on-light) #kwbar .kw{background:rgba(255,255,255,.1);color:#8e8e93}
body:not(.on-light) #kwbar .kw.done{background:rgba(255,255,255,.24);color:#f5f5f7}
body:not(.on-light) #kwbar .kw.cur{background:var(--action-dark);color:#fff}
html.still #kwbar,html.still #kwbar *{transition:none!important}

:root{--font:system-ui,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;--c-white:#ffffff;--c-parchment:#f5f5f7;--ink:#132742;--ink-2:#132742;--ink-3:#17375a;--action:#0066cc;--action-dark:#0071e3}
html{color-scheme:light}
.slide{--t2:#424245;--t3:#6e6e73;--act:#0066cc;background:#ffffff!important;color:#132742!important}
.brand{position:absolute;left:94px;top:43px;display:flex;align-items:center;gap:17px;font-size:31px;font-weight:600;letter-spacing:-.7px}
.brand-mark{width:37px;height:37px;border:3px solid #0066cc;border-radius:8px;display:inline-block;position:relative}
.gate{position:absolute;right:100px;top:100px;color:#132742;font-size:27px;font-weight:600}
.eyebrow{position:absolute;left:100px;top:139px;font-size:27px;letter-spacing:1px;color:#0066cc;font-weight:700}
.heading{position:absolute;left:94px;top:192px;width:1710px;font-size:72px;line-height:1.17;letter-spacing:-3px;font-weight:600}
.copy{position:absolute;left:100px;top:350px;width:530px;font-size:38px;line-height:1.55;letter-spacing:-1px}
.copy p+p{margin-top:28px}.copy strong{color:#0066cc;font-weight:600}.copy ul{padding-left:35px}.copy li+li{margin-top:22px}.copy .small{font-size:30px;line-height:1.5}
.copy b{color:#0066cc}.copy button{font-size:27px;border:1px solid #0066cc;background:#fff;color:#0066cc;border-radius:9999px;padding:12px 24px;margin:18px 10px 0 0;min-height:54px;font-weight:700}.copy button:hover{background:#e8f1fc}.copy button:focus-visible{outline:4px solid #0071e3;outline-offset:4px}.cover .copy b{color:#0066cc}.copy button[aria-pressed="true"]{background:#0066cc;color:white}
.graphic{position:absolute;left:690px;top:320px;width:1130px;height:580px;display:flex;align-items:center;justify-content:center;background:#fff;border:0;border-radius:0;overflow:hidden}
.graphic>svg{display:block;width:1100px;height:560px;flex-shrink:0;aspect-ratio:1100/560}
.graphic button{border:2px solid #d2d2d7;border-radius:12px;background:#f5f5f7;padding:12px 18px;font-size:28px;color:#0066cc;min-height:50px}
.graphic button:hover{background:#e8f1fc}.graphic button:focus-visible{outline:4px solid #0066cc;outline-offset:3px}
.takeaway{position:absolute;left:100px;right:100px;top:920px;min-height:64px;border-left:7px solid #0066cc;padding:7px 0 5px 24px;font-size:33px;line-height:1.4;font-weight:600}
.stage-foot{position:absolute;bottom:28px;left:100px;font-size:24px;color:#132742}

  staticScenes[0].setup=function(root,c){

    const replay=()=>{started=performance.now();paint(fixed?1:0);};
    staticListen(root.querySelector('[data-roll-replay]'),'click',replay,c);replay();
    if(!fixed)c.loop(()=>{const p=Math.max(0,Math.min(1,(performance.now()-started-300)/3000));paint(p*p*(3-2*p));});
  };

  staticScenes[2].setup=function(root,c){

    if (!needle) return;

        root.querySelectorAll('[data-dram-cell]').forEach((el,i)=>{const on=i===selected;el.setAttribute('aria-pressed',String(on));el.setAttribute('aria-label',`기억 칸 ${i+1}, 저장값 ${values[i]}`);const box=el.querySelector('[data-dram-cell-box]');box.setAttribute('fill',on?'#d5e8ff':C.pale);box.setAttribute('stroke',on?C.blue:C.line);box.setAttribute('stroke-width',on?'5':'2');el.querySelector('[data-dram-cell-value]').textContent=String(values[i]);el.querySelector('[data-dram-cell-bar]').setAttribute('width',String(85*levels[i]));});
        q('[data-dram-cell-heading]').textContent=`${selected+1}번 칸 · 저장값 ${values[selected]}`;
        q('[data-dram-cell-switch]').setAttribute('d',phase==='shared'||phase==='sense'?'M657 218H778':'M657 218L778 193');
        q('[data-dram-cell-link]').setAttribute('opacity',phase==='shared'||phase==='sense'?'1':'0');q('[data-dram-cell-link]').setAttribute('stroke-dashoffset',String(-pulse));
        root.dataset.dramCellSelected=String(selected);root.dataset.dramCellValue=String(values[selected]);root.dataset.dramCellPhase=phase;root.dataset.dramCellValues=values.join('');root.dataset.dramCellLevels=levels.map(v=>v.toFixed(3)).join(',');
      };
      const select=i=>{if(phase==='shared'||phase==='sense'){targets[selected]=values[selected]?.9:.1;levels[selected]=targets[selected];}selected=i;resetRead();q('[data-dram-cell-status]').textContent=`${i+1}번 칸을 골랐어요. 0과 1을 쓰거나 읽기를 차례로 눌러 보세요.`;q('[data-dram-cell-caption]').textContent='한 칸은 0 또는 1, 한 가지를 저장해요.';paint();};
      const action=value=>{
        const status=q('[data-dram-cell-status]'),caption=q('[data-dram-cell-caption]'),read=q('[data-dram-array-action="read"]');
        if(value==='reset'){values=bitValues.slice();selected=0;motionTo(values.map(v=>v?.9:.1));resetRead();status.textContent='각 칸의 0과 1이 서로 다르게 저장되어 있어요.';caption.textContent='0은 0으로, 1은 1로 유지해요.';}
        if(value==='zero'||value==='one'){values[selected]=value==='one'?1:0;const next=targets.slice();next[selected]=values[selected]?.9:.1;motionTo(next);resetRead();status.textContent=`${selected+1}번 칸에 ${values[selected]}을 썼어요. 다른 칸의 값은 그대로예요.`;caption.textContent='이것은 실제 DRAM의 0·1 쓰기를 비교하는 모형이에요.';}
        if(value==='read'){
          if(phase==='ready'||phase==='restored'||phase==='refreshed'){
            phase='shared';const next=targets.slice();next[selected]=values[selected]?.6:.4;motionTo(next);read.textContent='② 작은 차이 감지';status.textContent='① 저장 축전기와 읽는 연결선이 전하를 나누어 가져요.';caption.textContent='읽을 때 축전기의 저장 상태도 달라져요.';q('[data-dram-cell-sense]').textContent='0과 1이 만드는 작은 차이를 기다려요.';
          }else if(phase==='shared'){
            phase='sense';read.textContent='③ 원래 값 복원';status.textContent=`② 감지 회로가 작은 차이를 읽어 ${values[selected]}을 알아냈어요.`;caption.textContent=`읽은 값: ${values[selected]} · 다음은 원래 상태로 복원해요.`;q('[data-dram-cell-sense]').textContent=`${values[selected]}을 읽었어요. 원래 상태로 다시 써요.`;
          }else{
            phase='restored';const next=targets.slice();next[selected]=values[selected]?.9:.1;motionTo(next);read.textContent='① 다시 읽기';status.textContent=`③ 읽은 ${values[selected]}을 원래 상태로 복원했어요.`;caption.textContent='실제 DRAM에서는 이 과정이 빠르게 이어져요.';q('[data-dram-cell-sense]').textContent=`감지한 ${values[selected]}을 다시 써서 복원했어요.`;
          }
        }
        if(value==='wait'){resetRead();motionTo(values.map(v=>v?.63:.1));status.textContent='시간이 지나면 누설로 저장 상태가 약해질 수 있어요.';caption.textContent='이 모형은 높은 저장 상태가 약해지는 예를 보여 줘요.';}
        if(value==='refresh'){resetRead();phase='refreshed';motionTo(values.map(v=>v?.9:.1));status.textContent='원래 값을 읽고 다시 써요. 0은 0, 1은 1로 유지해요.';caption.textContent='모든 칸을 1로 채우는 것이 아니에요.';q('[data-dram-cell-sense]').textContent='원래 0과 1을 유지하도록 감지·복원';}
        last=performance.now();paint();
      };
      root.querySelectorAll('[data-dram-cell]').forEach(el=>{const use=()=>select(Number(el.dataset.dramCell));listen(el,'click',use,dispose);listen(el,'keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();use();}},dispose);});
      root.querySelectorAll('[data-dram-array-action]').forEach(el=>listen(el,'click',()=>action(el.dataset.dramArrayAction),dispose));
      select(0);
      if(!fixed(c))c.loop(()=>{if(!alive)return;const now=performance.now(),dt=Math.min((now-last)/1000,.08);last=now;pulse=(pulse+dt*28)%52;levels=levels.map((v,i)=>Math.abs(v-targets[i])<.001?targets[i]:v+(targets[i]-v)*Math.min(1,dt*4));paint();});
      c.onDispose(()=>{alive=false;dispose.forEach(fn=>fn());});
    }
  };

  deck.extras=[cellScene,componentScene,waterScene];
  deck.simIndex=deck.scenes.findIndex(s=>s.simId==='dram-write-read')+1;
  if(!deck.sources.some(s=>s.url==='https://ocw.mit.edu/courses/6-004-computation-structures-spring-2017/pages/c5/c5s1/'))deck.sources.push({title:'MIT · 축전기 메모리의 쓰기·읽기·리프레시',url:'https://ocw.mit.edu/courses/6-004-computation-structures-spring-2017/pages/c5/c5s1/'});
}());

(function(){
  'use strict';
  // User preference: no gray explanatory text on white, including SVG captions.
  // Preserve meaningful charge/field colors and white symbols on colored discs.
  function readable(color){
    if(!/^#[0-9a-f]{6}$/i.test(color))return color;
    const rgb=[1,3,5].map(i=>parseInt(color.slice(i,i+2),16));
    const hi=Math.max(...rgb),lo=Math.min(...rgb);
    return hi<235 && (hi-lo)/Math.max(hi,1)<.38 ? '#132742' : color;
  }
  window.HNR_DECKS.forEach(d=>d.scenes.forEach(s=>{
    s.visual=s.visual.replace(/<(?:text|tspan)\b[^>]*>/g,tag=>tag.replace(/fill="(#[0-9a-f]{6})"/gi,(_,color)=>`fill="${readable(color)}"`));
  }));
})();
