/* HNR festival desk: cream paper, cobalt print, lime ticket accents. */
:root {
  --ink: #132d4b;
  --blue: #1747dc;
  --line: #b1bbbd;
  --pale: #edf2ff;
  --paper: #fffaf0;
  --lime: #dafa76;
  --danger: #8a2618;
  color: var(--ink);
  background: var(--paper);
}
body { background: var(--paper); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
  outline-color: var(--blue);
}
.mast {
  background: var(--paper);
  padding-block: 16px;
  border-bottom: 1px solid var(--ink);
}
.brand { font-weight: 800; letter-spacing: -.045em; }
.brand img { width: 54px; height: 54px; }
.brand small { font-size: .68rem; color: var(--ink); }
.state-label {
  background: #e8efda;
  color: #224f31;
  border: 1px solid #96ad83;
  border-radius: 999px;
  padding: 5px 12px;
}
.button {
  font-weight: 750;
  border-radius: 10px;
  padding: 10px 19px;
}
.button.secondary { background: var(--paper); }
.button.quiet { color: var(--ink); }
.button.danger { background: #fff0e8; }
.button:disabled { background: #e6e6dc; color: #4b5658; border-color: #a4aca9; }
.workbar { padding-block: 15px; }
.date-switch {
  border: 1px solid var(--ink);
  background: transparent;
  border-radius: 999px;
  padding: 4px;
}
.date-switch button { border-radius: 999px; color: var(--ink); }
.date-switch button.selected { background: var(--lime); color: var(--ink); }
.date-switch span { font-weight: 800; }
.clock { letter-spacing: .01em; }
.tabs {
  background: var(--paper);
  border-block: 1px solid var(--ink);
  gap: 8px;
  padding-block: 7px;
}
.tabs button { border: 0; border-radius: 8px; padding: 10px 22px; }
.tabs button[aria-current=page] { background: var(--blue); color: #fff; }
#main { padding-top: 26px; }
.festival-hero {
  display: grid;
  grid-template-columns: 1.08fr 1fr;
  gap: clamp(20px, 4vw, 70px);
  position: relative;
  align-items: center;
  padding: 24px 18px 30px;
  border-bottom: 1px solid var(--ink);
  margin-bottom: 30px;
  isolation: isolate;
}
.festival-copy { min-width: 0; position: relative; z-index: 1; }
.hero-kicker {
  display: inline-block;
  font-size: .69rem;
  font-weight: 800;
  letter-spacing: .15em;
  color: var(--ink);
  padding-bottom: 5px;
  border-bottom: 2px solid var(--ink);
  margin-bottom: 18px;
}
.festival-title { line-height: 1.1; letter-spacing: -.065em; }
.festival-stem {
  display: block;
  font-size: clamp(20px, 2.1vw, 30px);
  font-weight: 800;
  letter-spacing: -.04em;
  margin-bottom: 7px;
}
.festival-title strong {
  display: inline-block;
  position: relative;
  font-size: clamp(44px, 4.75vw, 72px);
  line-height: 1.07;
  letter-spacing: -.07em;
  font-weight: 900;
  color: var(--blue);
}
.hero-star {
  display: inline-block;
  vertical-align: top;
  position: absolute;
  right: -38px;
  top: -15px;
  font-size: 47px;
  line-height: 1;
  color: var(--blue);
  transform: rotate(-12deg);
}
.festival-booking {
  display: block;
  margin-top: 12px;
  font-size: clamp(22px, 2.1vw, 30px);
  font-weight: 800;
  letter-spacing: -.05em;
}
.festival-subtitle { margin-top: 17px; font-size: .96rem; font-weight: 650; }
.hero-caption {
  display: flex;
  flex-wrap: wrap;
  gap: 7px 18px;
  margin-top: 20px;
  font-size: .61rem;
  letter-spacing: .07em;
  font-weight: 850;
}
.hero-caption span { padding: 4px 0; border-block: 1px solid var(--ink); }
.hero-art { min-width: 0; width: min(100%, 460px); justify-self: end; position: relative; padding: 7px 15px 24px; }
.hero-photo {
  margin: 0;
  background: #fff;
  border: 1px solid var(--ink);
  padding: 10px 10px 0;
  transform: rotate(2deg);
}
.hero-photo img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 3 / 2;
  object-fit: cover;
  background: #e7edfb;
  border: 1px solid #bac3d1;
}
.hero-photo figcaption {
  padding: 12px 2px 13px;
  color: var(--ink);
  font-size: .71rem;
  font-weight: 800;
  letter-spacing: .12em;
}
.hero-sticker {
  display: block;
  position: absolute;
  right: 0;
  bottom: 7px;
  padding: 14px 21px;
  border: 1px solid var(--ink);
  background: var(--lime);
  color: var(--ink);
  font-size: .85rem;
  line-height: 1.45;
  font-weight: 800;
  transform: rotate(-3deg);
}
.page-head { margin-bottom: 20px; }
.page-head h1, .page-head h2 { font-size: 1.85rem; font-weight: 850; letter-spacing: -.055em; line-height: 1.25; }
.page-head p { color: var(--ink); }
.eyebrow { font-size: .65rem; color: var(--blue); letter-spacing: .09em; }
.summary {
  background: var(--blue);
  border: 1px solid var(--blue);
  border-radius: 14px;
  margin-bottom: 24px;
}
.summary > div { border-right: 1px dashed #b2c4ff; }
.summary b { font-size: 2rem; font-weight: 850; }
.summary b small { font-size: .8rem; padding-left: 4px; font-weight: 700; }
.summary label, .summary span { color: #fff; font-weight: 650; }
.summary select { color: var(--ink); background: #fffdf7; border-color: #fff; }
.panel { border-radius: 14px; background: #fffdf7; border-color: var(--line); }
.desk-grid > div:first-child > .panel { border: 1px solid var(--ink); }
.section-head { padding-bottom: 12px; border-bottom: 1px dashed #a8b3ba; }
.section-head h2 { font-size: 1.18rem; font-weight: 850; }
.muted, .field small, .team .caption { color: #274363; }
.segmented { background: #e8edec; border-radius: 10px; padding: 4px; }
.segmented button { border-radius: 7px; }
.segmented button.selected { background: var(--lime); color: var(--ink); }
input, select { border-color: #849493; border-radius: 8px; background: #fff; }
input[type=checkbox] { accent-color: var(--blue); }
.team { background: #fffefb; border-color: #a9b6ba; border-radius: 9px; }
.team.selected-team { background: #f4f6ff; border-color: var(--blue); }
.team .time { font-weight: 850; letter-spacing: -.035em; }
.team .caption { margin-bottom: 12px; }

  function summary() {

  function occupancyTag(t) {
    const n=M.counts(today(),t.id), r=today().rounds.find(x=>x.id===t.roundId);
    if (ended(t)) return '<span class="tag">시간 종료</span>';
    if (t.closed || r.closed) return '<span class="tag">접수 마감</span>';
    if (n.total>t.capacity) return '<span class="tag error">정원 초과 '+(n.total-t.capacity)+'명</span>';
    if (!n.available) return '<span class="tag">전체 마감</span>';
    return '<span class="tag good">전체 '+n.available+'자리 남음</span>';
  }
  function teamCard(t, edit) {
    const n=M.counts(today(),t.id), r=today().rounds.find(x=>x.id===t.roundId);

    let out='<article class="team'+(chosenTeam===t.id?' selected-team':'')+'"><div class="row-between"><strong class="time">'+esc(t.start)+'–'+esc(t.end)+'</strong>'+occupancyTag(t)+'</div><p class="caption">'+esc(r.label)+' · '+esc(t.label)+' · '+(M.toMinutes(t.end)-M.toMinutes(t.start))+'분</p><div class="count-row"><span>접수 <b>'+n.total+'/'+t.capacity+'</b>명</span><span>예약 <b>'+n.reserved+'/'+t.reserveLimit+'</b>명</span></div><div class="seat-track" aria-hidden="true">'+Array.from({length:Math.min(t.capacity,20)},(_,i)=>'<span'+(i<n.total?' class="used"':'')+'></span>').join('')+'</div>';

    if (edit) out+=warnings.map(w=>'<div class="note warn blank-space">'+esc(w.message)+'</div>').join('');

  function guestSlot(t,reservation) {
    const d=today(), n=M.counts(d,t.id), round=d.rounds.find(r=>r.id===t.roundId);
    const started=Date.parse(now())>=Date.parse(dayKey+'T'+t.start+':00+09:00');

    const count=reservation?n.reserveAvailable:Math.max(0,n.available-protectedSeats);
    const closed=t.closed||!round||round.closed||ended(t);
    const label=d.paused?'접수 잠시 중지':closed?'접수 마감':count>0?(reservation?'예약 가능 ':'현장 접수 가능 ')+'<strong>'+count+'명</strong>':(reservation?'예약 마감':'현장 접수 마감');
    const open=!d.paused&&!closed&&count>0;
    return '<div class="guest-slot" data-guest-team="'+esc(t.id)+'"><div><p class="time">'+esc(t.start)+' <small>'+(started?'시작':'입장')+'</small></p><p class="slot-duration">체험 '+(M.toMinutes(t.end)-M.toMinutes(t.start))+'분'+(n.active>0?' · 체험 진행 중':'')+'</p></div><p class="guest-availability'+(open?' is-open':'')+'">'+label+'</p></div>';

  async function restore(file) {
    if(!file)return;
    try {
      if(file.size>12000000)throw new Error('백업 파일이 너무 큽니다. 12MB 이하 파일을 사용해 주세요.');
      const data=JSON.parse(await file.text());
      if(data.format!=='hnr-desk-backup'||data.version!==1)throw new Error('HNR 접수 데스크 백업 파일이 아닙니다.');
      M.validate(data.state);
      const summary=Object.keys(state.days).map(d=>'<li>'+esc(d)+': 현재 '+state.days[d].entries.length+'건 → 백업 '+data.state.days[d].entries.length+'건</li>').join('');
      confirmInModal('백업으로 기록 복원','<p>현재 두 날짜의 시간표와 기록을 백업 파일로 교체합니다.</p><ul class="impact-list">'+summary+'</ul><div class="note warn">현재 기록과 자동으로 합치지 않습니다. 복원 직전 자료는 되돌리기에 보관합니다.</div><label class="check-row"><input id="restoreConfirmed" type="checkbox">기록 교체 내용을 확인했습니다.</label>',()=>{
        if(!$('#restoreConfirmed').checked)throw new Error('기록 교체 내용을 확인해 주세요.');
        const previous=clone(state), next=preserveCounters(clone(data.state),state);
        persist(next,undoStack.concat([previous]).slice(-10));render();toast('백업을 복원했습니다.');
      },'백업으로 복원');
    }catch(e){toast(e.message);}
    const input=$('#restoreFile');if(input)input.value='';

      case 'undo':undo();break;
      case 'current':commit({type:'EDIT_DAY',patch:{currentRoundId:id}});render();break;
      case 'pickWalkin':kind='walkin';chosenTeam=id;setTab('desk');$('#registerForm').scrollIntoView({block:'center',behavior:'smooth'});break;
      case 'pickReservation':kind='reservation';chosenTeam=id;setTab('desk');$('#registerForm').scrollIntoView({block:'center',behavior:'smooth'});break;
      case 'editTeam':teamEditor(id);break;
      case 'addTeam':teamEditor(null,id);break;
      case 'toggleTeam':commit({type:'EDIT_TEAM',id,patch:{closed:!teamBy(id).closed}});render();break;
      case 'editRound':roundEditor(id);break;
      case 'addRound':roundEditor();break;
      case 'editBreaks':breaksEditor();break;
      case 'assign':assignEntry(e);break;
      case 'arrive':updateStatus(e,'arrived');break;
      case 'start':updateStatus(e,'active');break;
      case 'finish':updateStatus(e,'done');break;
      case 'noshow':updateStatus(e,'noshow');break;
      case 'cancel':updateStatus(e,'cancelled');break;
    }
  }
  document.addEventListener('click',ev=>{
    const close=ev.target.closest('[data-close]');if(close){closeModal();return;}
    const date=ev.target.closest('[data-date]');if(date){dayKey=date.dataset.date;chosenTeam='';render();return;}
    const nav=ev.target.closest('[data-tab],[data-nav]');if(nav){setTab(nav.dataset.tab||nav.dataset.nav);return;}
    const kindButton=ev.target.closest('[data-kind]');if(kindButton){kind=kindButton.dataset.kind;chosenTeam='';render();return;}
    const a=ev.target.closest('[data-action]');if(a){try{actionClick(a.dataset.action,a.dataset.id);}catch(e){toast(e.message);}}
  });
  document.addEventListener('submit',ev=>{
    if(ev.target.id==='registerForm'){ev.preventDefault();submitRegistration(ev.target);}
    if(ev.target.id==='bookingForm'){
      ev.preventDefault();try{const fd=new FormData(ev.target);commit({type:'EDIT_DAY',patch:{bookingMode:String(fd.get('bookingMode')),openRoundIds:fd.getAll('openRoundIds').map(String)}});render();toast('예약 범위를 적용했습니다.');}catch(e){toast(e.message);}
    }
  });
  document.addEventListener('change',ev=>{
    try {
      if(ev.target.id==='currentRound'){commit({type:'EDIT_DAY',patch:{currentRoundId:ev.target.value}});chosenTeam='';render();}
      if(ev.target.id==='registerTeam')chosenTeam=ev.target.value;
      if(ev.target.id==='registerAge')age=ev.target.value;
      if(ev.target.id==='bookingMode')$('#manualRounds').hidden=ev.target.value!=='manual';
      if(ev.target.id==='statusFilter'){filter=ev.target.value;render();}
      if(ev.target.id==='restoreFile')restore(ev.target.files[0]);
      if(ev.target.id==='practiceTime'){selectedPracticeTime=ev.target.value||'10:05';render();}
    }catch(e){toast(e.message);render();}
  });
  document.addEventListener('input',ev=>{
    if(ev.target.id==='searchPeople'){
      const caret=ev.target.selectionStart;query=ev.target.value;
      $('#main').innerHTML=peopleView();const input=$('#searchPeople');input.focus();input.setSelectionRange(caret,caret);
    }
  });
  $('#displayButton').onclick=()=>{const url=new URL(location.href);url.searchParams.set('display','1');url.searchParams.set('date',dayKey);url.hash='';window.open(url.href,'hnr-desk-display','noopener');};
  $('#practiceButton').onclick=openPractice;
  $('#exitPractice').onclick=()=>{const url=new URL(location.href);url.searchParams.delete('practice');url.searchParams.delete('display');url.searchParams.set('date',dayKey);url.hash='desk';location.href=url.href;};
  $('#modal').addEventListener('cancel',()=>{setTimeout(()=>{$('#modalBody').innerHTML='';},0);});
  window.addEventListener('storage',ev=>{if(ev.key===key()){loadStore();render();}});
  window.addEventListener('pagehide',()=>{if(releaseLock)releaseLock();});
  window.addEventListener('pageshow',ev=>{if(ev.persisted)location.reload();});
  window.addEventListener('hashchange',()=>{if(['desk','people','schedule','settings'].includes(location.hash.slice(1))){tab=location.hash.slice(1);render();}});
  setInterval(()=>{
    if(!state)return;
    const minute=timeOf(now());$('#clock').textContent=(practice?'연습 ':'현재 ')+minute;
    if(minute!==lastMinute){lastMinute=minute;if(guest)render();else if(tab==='people'&&!$('#modal').open&&!document.activeElement.matches('input,select'))render();}
  },1000);
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(async reg=>{
      if(reg.active)reg.active.postMessage({type:'CACHE_STATUS'});
    }).catch(()=>{offlineReady=false;});
    navigator.serviceWorker.addEventListener('message',ev=>{if(ev.data&&ev.data.type==='CACHE_READY'){offlineReady=true;if(tab==='settings')render();}});
  }
  acquire();
})();
</script>
</body></html>
